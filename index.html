}

function storeSelector(ingredientId) {
  const stores = getAllStores();
  if (stores.length === 0) return '';
  const current = (state.itemStores && state.itemStores[ingredientId]) || '';
  let opts = `<option value="">${T('chooseStore')}</option>`;
  for (const s of stores) {
    opts += `<option value="${s.id}" ${current === s.id ? 'selected' : ''}>${s.name}</option>`;
  }
  return `<select class="store-select" onchange="setItemStore('${ingredientId}', this.value)">${opts}</select>`;
}

// Compute shopping list (3 weeks)
function buildShoppingList() {
  const totals = {}; // ingredientId -> grams or pieces
  for (let week = 0; week < 3; week++) {
    for (let d = 0; d < 7; d++) {
      const menu = MENUS[WEEK_ORDER[d]];
      for (const mt of MEAL_TYPES) {
        const meal = menu[mt.id];
        if (!meal) continue;
        for (const item of meal.items) {
          const target = resolveIngredient(item.ing);
          if (!target) continue;
          // SKIP: if the resolved ingredient is still disabled (means no substitute exists)
          if (!isEnabled(target.id)) continue;
          if (!totals[target.id]) totals[target.id] = {g:0, pieces:0, unit: item.unit};
          totals[target.id].g += item.g;
          if (item.piece) totals[target.id].pieces += item.piece;
        }
      }
    }
  }
  // Add ingredients with purchaseQty (always purchase for 3 weeks)
  for (const ing of INGREDIENTS) {
    if (ing.purchaseQty && !totals[ing.id] && isEnabled(ing.id)) {
      totals[ing.id] = {g:0, pieces:0, unit:'', custom: state.lang === 'en' ? (ing.purchaseQtyEn || ing.purchaseQty) : ing.purchaseQty};
    }
  }
  // Include ALL enabled ingredients (incl. user-added), so any non-excluded food
  // is trackable/buyable even if it isn't a default in the plan — shown as optional.
  for (const ing of allIngredients()) {
    if (ing.cat === 'tea' || ing.cat === 'spice') continue; // free / unlimited
    if (!isEnabled(ing.id)) continue;
    if (!totals[ing.id]) totals[ing.id] = {g:0, pieces:0, unit:'', optional:true};
  }
  // Group by category
  const byCat = {};
  for (const [id, data] of Object.entries(totals)) {
    const ing = getIngredient(id);
    if (!ing) continue;
    if (!byCat[ing.cat]) byCat[ing.cat] = [];
    byCat[ing.cat].push({id, ing, ...data});
  }
  return byCat;
}

function buildWeekShoppingList(off) {
  // Per-week shopping: aggregate the actual 7 dates of the selected week,
  // honoring per-date substitutions/plan (resolveForSlot) + cheese scaling.
  const totals = {};
  const dates = weekDatesForOffset(off || 0);
  for (const dateISO of dates) {
    const menu = menuForDate(dateISO).menu;
    if (!menu) continue;
    const order = getMealOrder(dateISO);
    for (const mealId of order) {
      const meal = menu[mealId];
      if (!meal) continue;
      for (const item of meal.items) {
        const orig = getIngredient(item.ing);
        if (!orig) continue;
        const resolved = resolveForSlot(item, mealId, dateISO) || orig;
        if (!resolved || !isEnabled(resolved.id)) continue;
        let g = effectiveGrams(item, resolved.id);
        if (!totals[resolved.id]) totals[resolved.id] = {g:0, pieces:0, unit: item.unit};
        totals[resolved.id].g += g;
        if (item.piece) totals[resolved.id].pieces += item.piece;
      }
      // user-added extra foods for this date+meal
      for (const ex of getMealExtras(dateISO, mealId)) {
        const ing = getIngredient(ex.ing);
        if (!ing || !isEnabled(ing.id)) continue;
        if (!totals[ing.id]) totals[ing.id] = {g:0, pieces:0, unit:''};
        totals[ing.id].g += (ex.g || 0);
      }
    }
  }
  // Items flagged with a standing purchaseQty (always buy)
  for (const ing of INGREDIENTS) {
    if (ing.purchaseQty && !totals[ing.id] && isEnabled(ing.id)) {
      totals[ing.id] = {g:0, pieces:0, unit:'', custom: state.lang === 'en' ? (ing.purchaseQtyEn || ing.purchaseQty) : ing.purchaseQty};
    }
  }
  // Include ALL enabled foods (incl. user-added) as optional so any non-excluded
  // food is buyable / assignable to a store even when not in this week's plan.
  for (const ing of allIngredients()) {
    if (ing.cat === 'tea' || ing.cat === 'spice') continue;
    if (!isEnabled(ing.id)) continue;
    if (!totals[ing.id]) totals[ing.id] = {g:0, pieces:0, unit:'', optional:true};
  }
  const byCat = {};
  for (const [id, data] of Object.entries(totals)) {
    const ing = getIngredient(id);
    if (!ing) continue;
    if (!byCat[ing.cat]) byCat[ing.cat] = [];
    byCat[ing.cat].push({id, ing, ...data});
  }
  return byCat;
}

function slicedCheeseInfo(ing) {
  // returns {perPiece} if this is a sliced (toast-slice) cheese, else null
  if (ing && ing.cat === 'cheese' && ing.sliced && ing.perPiece) return {perPiece: ing.perPiece};
  return null;
}

// Items measured in pieces (shop/stock): sliced cheese -> slices, IMON biscuits -> pcs
function getPack(ing) {
  if (!ing) return null;
  if (state.packs && Object.prototype.hasOwnProperty.call(state.packs, ing.id)) return state.packs[ing.id];
  return ing.pack || null;
}
// Base measurement unit of a product: 'g' (default), 'ml', or 'pcs' (pieces).
function baseUnitOf(ing) {
  const pk = getPack(ing);
  if (pk && pk.base) return pk.base;
  return (ing && ing.unitBase) || 'g';
}
function unitLabelG(ing) { return baseUnitOf(ing) === 'ml' ? 'ml' : 'g'; }
// Format a stored amount (always grams/ml-equivalent internally) with the product's unit.
function fmtAmt(v, ing) {
  if (baseUnitOf(ing) === 'ml') return v >= 1000 ? (r(v/1000, 2) + ' L') : (r(v) + ' ml');
  return v >= 1000 ? (r(v/1000, 2) + ' kg') : (r(v) + ' g');
}
function packSummary(ing) {
  const pk = getPack(ing);
  if (!pk) return '';
  const ul = (pk.base === 'ml') ? 'ml' : 'g';
  if (pk.g) {
    const unit = state.lang === 'en' ? (pk.unitEn || pk.unit) : pk.unit;
    const boxTxt = pk.perBox ? `${state.lang === 'en' ? (pk.boxEn || 'box') : (pk.box || 'κουτί')} ${pk.perBox} × ` : '';
    return `<div class="alt-display">📦 ${boxTxt}${pk.g} ${ul} / ${unit}</div>`;
  }
  const boxName = state.lang === 'en' ? (pk.boxEn || 'pack') : (pk.box || 'συσκευασία');
  if (pk.base === 'ml') return `<div class="alt-display">📏 ml${pk.perBox ? ` · ${boxName} ${pk.perBox} ml` : ''}</div>`;
  if (pk.perBox) return `<div class="alt-display">📏 g · ${boxName} ${pk.perBox} g</div>`;
  return '';
}
function pieceUnitInfo(ing) {
  if (!ing) return null;
  const _hasOv = state.packs && Object.prototype.hasOwnProperty.call(state.packs, ing.id);
  const _pk = getPack(ing);
  if (_pk && _pk.g) {
    const en = state.lang === 'en';
    return {
      perPiece: _pk.g,
      label: en ? (_pk.pluralEn || _pk.unitEn || _pk.plural || _pk.unit || 'units') : (_pk.plural || _pk.unit || 'τεμ'),
      glabel: '/' + (en ? (_pk.unitEn || _pk.unit || 'unit') : (_pk.unit || 'τεμ')),
      pack: _pk
    };
  }
  if (_hasOv) return null; // explicit override without a piece size → weight/volume, not pieces
  if (!ing.perPiece) return null;
  if (ing.cat === 'cheese' && ing.sliced) {
    return {perPiece: ing.perPiece, label: 'slices', glabel: state.lang === 'en' ? '/slice' : '/φέτα'};
  }
  if (ing.countByPiece) {
    return {perPiece: ing.perPiece, label: 'pcs', glabel: state.lang === 'en' ? '/pc' : '/τεμ'};
  }
  return null;
}

function isRowCovered(row) {
  if (state.shopNetMode === false) return false;
  const hadNeed = (row.g || 0) > 0 || (row.pieces || 0) > 0;
  if (!hadNeed) return false;
  const have = getInvGrams(row.id);
  if ((row.g || 0) > 0) return (row.g - have) <= 0;
  const per = (row.ing && row.ing.perPiece) ? row.ing.perPiece : 0;
  const haveP = per ? have / per : 0;
  return ((row.pieces || 0) - haveP) <= 0;
}
function shopRowDisplay(row) {
  // Respects state.shopNetMode: net (subtract stock) by default, else gross plan.
  const net = state.shopNetMode !== false;
  const have = getInvGrams(row.id);
  const hadNeed = (row.g || 0) > 0 || (row.pieces || 0) > 0;
  if (!net) {
    const nd = computeNeeded(row);
    return {qty: formatQty(row), covered: false, hint: nd.text};
  }
  if (!hadNeed) return {qty: formatQty(row), covered: false, hint: ''};
  let ng, np;
  if ((row.g || 0) > 0) {
    ng = Math.max(0, row.g - have);
    const ratio = ng / row.g;
    np = row.pieces ? Math.round(row.pieces * ratio) : 0;
  } else {
    const per = (row.ing && row.ing.perPiece) ? row.ing.perPiece : 0;
    const haveP = per ? have / per : 0;
    np = Math.max(0, Math.round((row.pieces || 0) - haveP));
    ng = 0;
  }
  const covered = ng <= 0 && np <= 0;
  const haveTxt = have > 0 ? (T('haveLabel') + ' ' + fmtAmt(have, row.ing)) : '';
  if (covered) return {qty: '', covered: true, hint: haveTxt};
  return {qty: formatQty({ing: row.ing, g: ng, pieces: np, unit: row.unit}), covered: false, hint: haveTxt};
}
function shopQtyHTML(row) {
  const d = shopRowDisplay(row);
  if (d.covered) {
    return `<div class="shop-qty"><span class="needed" style="color:var(--green)">\u2713 ${T('coveredLabel')}</span>${d.hint ? `<span class="needed">${d.hint}</span>` : ''}</div>`;
  }
  return `<div class="shop-qty">${d.qty}${d.hint ? `<span class="needed">${d.hint}</span>` : ''}</div>`;
}

function formatQty(row) {
  if (row.custom) return row.custom;
  if ((row.g || 0) <= 0 && (row.pieces || 0) <= 0) return '';
  const pu = pieceUnitInfo(row.ing);
  if (pu && (row.g > 0 || row.pieces > 0)) {
    const n = row.pieces > 0 ? row.pieces : Math.max(1, Math.round(row.g / pu.perPiece));
    const g = row.g > 0 ? row.g : n * pu.perPiece;
    return `${n} ${pu.label} (≈${fmtAmt(g, row.ing)})`;
  }
  if (row.pieces > 0 && row.g === 0) {
    return `${row.pieces} pcs`;
  }
  if (row.pieces > 0) {
    return `${fmtAmt(row.g, row.ing)} + ${row.pieces} pcs`;
  }
  return fmtAmt(row.g, row.ing);
}

function computeNeeded(row) {
  // Compare to inventory
  const inv = getInvGrams(row.id);
  const need = row.g - inv;
  if (need <= 0) return {text:'', g:0};
  if (inv > 0) return {text: `χρειάζεσαι ${fmtAmt(need, row.ing)} (έχεις ${fmtAmt(inv, row.ing)})`, g: need};
  return {text: '', g: row.g};
}

function trackerDate() { return state.trackerDate || todayISO(); }

// Weekday index (Mon=0..Sun=6) + menu for an ISO date — UTC-consistent with todayISO()
function menuForDate(dateISO) {
  const d = new Date(dateISO + 'T00:00:00Z');
  const idx = (d.getUTCDay() + 6) % 7;
  return {idx, menuKey: WEEK_ORDER[idx], menu: MENUS[WEEK_ORDER[idx]], dayName: DAY_NAMES[idx]};
}

function trackerNav(delta) {
  const d = new Date(trackerDate() + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + delta);
  let iso = d.toISOString().slice(0,10);
  if (iso > todayISO()) return; // no future days
  state.trackerDate = (iso === todayISO()) ? null : iso;
  saveState();
  render();
}

function trackerSetDate(iso) {
  if (!iso) return;
  if (iso > todayISO()) iso = todayISO();
  state.trackerDate = (iso === todayISO()) ? null : iso;
  saveState();
  render();
}

function trackerGoToday() {
  state.trackerDate = null;
  saveState();
  render();
}

function viewTracker() {
  const date = trackerDate();
  const log = state.log[date] || {meals:{}, water:0, weight:null, notes:''};
  if (!log.meals) log.meals = {};
  state.log[date] = log;

  const {dayName, menuKey, menu} = menuForDate(date);
  const isToday = (date === todayISO());

  // Compute consumed macros from checked meals
  let consumed = {cal:0,c:0,p:0,f:0};
  for (const mt of MEAL_TYPES) {
    if (log.meals[mt.id]) {
      const m = macrosForMeal(menu[mt.id]);
      consumed.cal += m.cal; consumed.c += m.c; consumed.p += m.p; consumed.f += m.f;
    }
  }

  let html = `<h2 class="section">${T('sectionTrack')} (${dayName})</h2>`;
  // Date navigation
  html += `<div class="tracker-date-nav">
    <button class="btn btn-ghost btn-sm" onclick="trackerNav(-1)">◀</button>
    <input type="date" value="${date}" max="${todayISO()}" onchange="trackerSetDate(this.value)"
           style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);font-size:14px">
    <button class="btn btn-ghost btn-sm" onclick="trackerNav(1)" ${isToday ? 'disabled style="opacity:.4"' : ''}>▶</button>
    ${!isToday ? `<button class="btn btn-secondary btn-sm" onclick="trackerGoToday()">${T('trackerToday')}</button>` : ''}
  </div>`;
  html += `<div class="subtle" style="margin-bottom:10px">${date} · Μενού ${menu.label}</div>`;
  if (!isToday) html += `<div class="notice" style="border-left-color:var(--orange)">📅 ${T('trackerPastBanner')}</div>`;
  html += `<div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="exportTrackerCSV()">📥 ${T('exportCsv')}</button></div>`;

  html += `<div class="card">
    <div class="card-title">${T('consumed')}</div>
    <div class="macro-summary">
      <div class="macro-card cal"><span class="value">${r(consumed.cal)}</span><span class="label">${T('macroCal')}</span></div>
      <div class="macro-card c"><span class="value">${r(consumed.c)}</span><span class="label">${T('macroC')}</span></div>
      <div class="macro-card p"><span class="value">${r(consumed.p)}</span><span class="label">${T('macroP')}</span></div>
      <div class="macro-card f"><span class="value">${r(consumed.f)}</span><span class="label">${T('macroF')}</span></div>
    </div>
  </div>`;

  // === STATS CARDS ===
  const dietStartObj = getDietStart();
  const dietStartISO = dietStartObj.toISOString().slice(0,10);
  const periodTab = state.statsPeriod || 'all';
  const periodOpts = {
    all:   {from: dietStartISO, label: T('statsAll')},
    week:  {from: startOfWeekISO(), label: T('statsWeek')},
    month: {from: startOfMonthISO(), label: T('statsMonth')},
    day:   {from: todayISO(), to: todayISO(), label: T('statsDay')},
  };

  html += `<div class="card">
    <div class="card-title">📊 ${T('statsTitle')}</div>
    <div class="chip-row" style="margin-bottom:12px">
      <button class="chip ${periodTab === 'day' ? 'active' : ''}" onclick="setState({statsPeriod:'day'})">${T('statsDay')}</button>
      <button class="chip ${periodTab === 'week' ? 'active' : ''}" onclick="setState({statsPeriod:'week'})">${T('statsWeek')}</button>
      <button class="chip ${periodTab === 'month' ? 'active' : ''}" onclick="setState({statsPeriod:'month'})">${T('statsMonth')}</button>
      <button class="chip ${periodTab === 'all' ? 'active' : ''}" onclick="setState({statsPeriod:'all'})">${T('statsAll')}</button>
    </div>`;
  const opt = periodOpts[periodTab];
  const spent = getTotalSpent(opt);
  const consumedVal = getConsumedValue(opt);
  const topC = getTopConsumed(5, opt);
  const topS = getTopSpent(5, opt);

  // Compute total grams consumed
  let totalGramsConsumed = 0;
  for (const r of topC) totalGramsConsumed += r.grams;
  // Days in period
  let days = 1;
  if (periodTab === 'all') {
    const today = new Date(); today.setHours(0,0,0,0);
    days = Math.max(1, Math.round((today - dietStartObj) / (1000*60*60*24)) + 1);
  } else if (periodTab === 'week') {
    const sow = new Date(startOfWeekISO()+'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    days = Math.max(1, Math.round((today - sow) / (1000*60*60*24)) + 1);
  } else if (periodTab === 'month') {
    const today = new Date();
    days = today.getDate();
  }

  html += `<div class="stats-grid">
    <div class="stat-card"><div class="stat-label">💰 ${T('statSpent')}</div><div class="stat-value">${spent.toFixed(2)}€</div></div>
    <div class="stat-card"><div class="stat-label">🍴 ${T('statConsumedValue')}</div><div class="stat-value">${consumedVal.toFixed(2)}€</div></div>
    <div class="stat-card"><div class="stat-label">⚖️ ${T('statConsumedG')}</div><div class="stat-value">${(totalGramsConsumed/1000).toFixed(2)} kg</div></div>
    <div class="stat-card"><div class="stat-label">📅 ${T('statDays')}</div><div class="stat-value">${days}</div></div>
    <div class="stat-card"><div class="stat-label">📈 ${T('statAvgDay')}</div><div class="stat-value">${(consumedVal/days).toFixed(2)}€</div></div>
  </div>`;

  // Top consumed
  if (topC.length > 0) {
    html += `<div style="margin-top:12px;font-size:13px;font-weight:600;color:var(--navy)">🥇 ${T('statTopConsumed')}</div>`;
    for (const r of topC) {
      html += `<div class="stat-row">
        <div>${shopIngName(r.ing)}</div>
        <div><span class="subtle">${r.grams}g</span> <strong style="color:var(--orange);margin-left:6px">${r.value.toFixed(2)}€</strong></div>
      </div>`;
    }
  }
  // Top spent
  if (topS.length > 0) {
    html += `<div style="margin-top:12px;font-size:13px;font-weight:600;color:var(--navy)">💸 ${T('statTopSpent')}</div>`;
    for (const r of topS) {
      html += `<div class="stat-row">
        <div>${r.ing ? shopIngName(r.ing) : r.id}</div>
        <div><strong style="color:var(--navy)">${r.total.toFixed(2)}€</strong></div>
      </div>`;
    }
  }
  html += `</div>`;

  html += `<div class="card">
    <div class="card-title">${T('dayMeals')}</div>`;
  for (const mt of MEAL_TYPES) {
    const meal = menu[mt.id];
    if (!meal) continue;
    const checked = log.meals[mt.id];
    html += `<div class="meal-check ${checked ? 'done' : ''}" onclick="toggleMealEaten('${mt.id}')">
      <input type="checkbox" class="meal-check-checkbox" ${checked ? 'checked' : ''}>
      <div class="meal-check-name"><strong>${mt.icon} ${T('mealTypesFull')[mt.id] || mt.name}</strong> · ${mealName(meal)} <span class="subtle">(${meal.time})</span></div>
    </div>`;
  }
  html += `</div>`;

  // Tea (σιδερίτη + δίκταμο) - 1 daily
  html += `<div class="card">
    <div class="card-title">🍵 ${T('teaTrackerTitle')}</div>
    <div class="meal-check ${log.tea ? 'done' : ''}" onclick="toggleTea()">
      <input type="checkbox" class="meal-check-checkbox" ${log.tea ? 'checked' : ''}>
      <div class="meal-check-name">${T('dailyRecTea')}</div>
    </div>
  </div>`;

  // Water
  html += `<div class="card">
    <div class="card-title">${T('water')} · ${log.water || 0} / 9 ${T('glasses')}</div>
    <div class="water-row">`;
  for (let i = 0; i < 9; i++) {
    const filled = (log.water || 0) > i ? 'filled' : '';
    html += `<div class="water-glass ${filled}" onclick="setWater(${i+1})">${filled ? '💧' : ''}</div>`;
  }
  html += `</div>
    <div class="subtle" style="margin-top:6px">${T('waterHint')}</div>
  </div>`;

  // Weight
  html += `<div class="card">
    <div class="card-title">${T('weight')}</div>
    <input type="number" step="0.1" min="0" value="${log.weight || ''}" onchange="setWeight(this.value)"
           style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);font-size:16px;"
           placeholder="${T('weightPlaceholder')}">
  </div>`;

  // Notes
  html += `<div class="card">
    <div class="card-title">${T('notes')}</div>
    <textarea onchange="setNotes(this.value)" placeholder="${T('notesPlaceholder')}">${log.notes || ''}</textarea>
  </div>`;

  // === FULL CONSUMPTION BREAKDOWN BY CATEGORY (collapsible) ===
  html += `<div class="card">
    <div class="card-title">📂 ${T('statsByCategory')} <span class="subtle" style="font-weight:400">· ${opt.label}</span></div>`;
  const byCatStats = {};
  for (const ing of INGREDIENTS) {
    const g = getConsumedGrams(ing.id, opt);
    if (g <= 0) continue;
    if (!byCatStats[ing.cat]) byCatStats[ing.cat] = {items: [], totalG: 0, totalV: 0};
    const v = g * getInvPricePerGram(ing.id);
    byCatStats[ing.cat].items.push({ing, grams: g, value: v});
    byCatStats[ing.cat].totalG += g;
    byCatStats[ing.cat].totalV += v;
  }
  const catsWithData = Object.keys(CATEGORIES).filter(c => byCatStats[c]);
  if (catsWithData.length === 0) {
    html += `<div class="subtle" style="padding:8px 0">${T('statsNoData')}</div>`;
  } else {
    html += `<div class="settings-cat-grid">`;
    for (const cat of catsWithData) {
      const d = byCatStats[cat];
      d.items.sort((a, b) => b.grams - a.grams);
      const exp = !!(state.statsCatExpanded && state.statsCatExpanded[cat]);
      html += `<div class="stats-cat settings-cat-card ${exp ? 'expanded' : 'collapsed'}">
        <div class="stats-cat-head" onclick="toggleStatsCat('${cat}')">
          <span>${exp ? '▾' : '▸'} ${CATEGORIES[cat].icon} ${T('categories')[cat] || CATEGORIES[cat].name}</span>
          <span class="stats-cat-tot">${r(d.totalG)} g${d.totalV > 0 ? ' · ' + d.totalV.toFixed(2) + '€' : ''}</span>
        </div>
        <div class="stats-cat-body" style="${exp ? '' : 'display:none'}">`;
      for (const it of d.items) {
        html += `<div class="stat-row">
          <div>${shopIngName(it.ing)}</div>
          <div><span class="subtle">${r(it.grams)} g</span>${it.value > 0 ? ' <strong style="color:var(--orange);margin-left:6px">' + it.value.toFixed(2) + '€</strong>' : ''}</div>
        </div>`;
      }
      html += `</div></div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;

  return html;
}

function viewSettings() {
  let html = `<h2 class="section">⚙️ ${T('sectionSettings')}</h2>`;

  // Diet start date
  const startISO = state.dietStartDate || getDietStart().toISOString().slice(0,10);
  html += `<div class="card">
    <h3 style="margin:0 0 10px;font-size:14px;color:var(--navy)">📅 ${T('dietStartTitle')}</h3>
    <div class="subtle" style="margin-bottom:8px">${T('dietStartHelp')}</div>
    <input type="date" value="${startISO}" onchange="setDietStartDate(this.value)"
           style="padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);font-size:14px;width:100%;max-width:200px">
    ${state.dietStartDate ? `<button class="btn btn-ghost btn-sm" style="margin-left:8px" onclick="setDietStartDate(null)">↺ ${T('reset')}</button>` : ''}
  </div>`;

  // (Η παλιά κάρτα «Backup / Transfer» αφαιρέθηκε — αντικαταστάθηκε από την κάρτα
  //  «Αντίγραφο ασφαλείας» παρακάτω, που δείχνει σύνοψη, ελέγχει το αρχείο και
  //  επαναφέρει την προηγούμενη κατάσταση αν η εισαγωγή αποτύχει.)

  // Compare foods
  html += `<div class="card">
    <h3 style="margin:0 0 8px;font-size:14px;color:var(--navy)">🔬 ${T('compareCmpCard')}</h3>
    <div class="subtle" style="margin-bottom:10px">${T('compareHelp')}</div>
    <button class="btn btn-block" onclick="openCompareModal()">🔬 ${T('compareBtnLabel')}</button>
  </div>`;

  html += `<div class="notice success">${T('settingsNotice')}</div>`;

  html += `<div class="card">
    <h3 style="margin:0 0 8px;font-size:14px;color:var(--navy)">\ud83c\udf7d\ufe0f ${T('myFoodsTitle')}</h3>
    <div class="subtle" style="margin-bottom:8px">${T('myFoodsHelp')}</div>
    <button class="btn btn-sm" onclick="openAddFoodModal()">\u2795 ${T('addFood')}</button>
  </div>`;

  // Diet plans (multiple, switchable)
  html += `<div class="card">
    <h3 style="margin:0 0 8px;font-size:14px;color:var(--navy)">\ud83d\udccb ${T('plansTitle')}</h3>
    <div class="subtle" style="margin-bottom:10px">${T('plansHelp')}</div>`;
  const planRow = (id, name) => {
    const active = (id === null && !state.activePlanId) || (id === state.activePlanId);
    return `<div class="ingredient-row">
      <div><div class="name">${active ? '\u2705 ' : ''}${name}</div></div>
      <div style="display:flex;gap:6px;align-items:center">
        ${active ? `<span class="subtle" style="font-size:12px">${T('activeNow')}</span>` : `<button class="btn btn-ghost btn-sm" onclick="setActivePlan(${id === null ? 'null' : `'${id}'`})">${T('activate')}</button>`}
        ${id !== null ? `<button class="btn btn-ghost btn-sm" style="color:var(--red);border-color:var(--red)" onclick="deletePlan('${id}')">\ud83d\uddd1</button>` : ''}
      </div>
    </div>`;
  };
  html += planRow(null, T('builtinPlan'));
  for (const pl of (state.plans || [])) html += planRow(pl.id, pl.name);
  html += `<button class="btn btn-sm" style="margin-top:8px" onclick="openImportPlanModal()">\u2b06\ufe0f ${T('importPlan')}</button>
  </div>`;

  html += `<div class="settings-cat-grid">`;

  // Group by category (includes user-added foods)
  const byCat = {};
  for (const ing of allIngredients()) {
    if (ing.cat === 'tea' || ing.cat === 'spice') continue; // hide free
    if (!byCat[ing.cat]) byCat[ing.cat] = [];
    byCat[ing.cat].push(ing);
  }

  for (const cat of Object.keys(CATEGORIES)) {
    if (!byCat[cat]) continue;
    const expanded = !!(state.catExpanded && state.catExpanded[cat]);
    const totalCat = byCat[cat].length;
    const offCat = byCat[cat].filter(i => (state.filters[i.id] || {enabled:true}).enabled === false).length;
    html += `<div class="card settings-cat-card ${expanded ? 'expanded' : 'collapsed'}">
      <h3 class="settings-cat-title cat-toggle" onclick="toggleCatExpand('${cat}')" style="cursor:pointer;justify-content:space-between">
        <span>${expanded ? '▾' : '▸'} ${CATEGORIES[cat].icon} ${T('categories')[cat] || CATEGORIES[cat].name}</span>
        <span class="cat-count">${totalCat - offCat}/${totalCat}</span>
      </h3>
      <div class="cat-body" style="${expanded ? '' : 'display:none'}">`;
    // For cheese, sort by fat category and show subheadings
    let catItems = byCat[cat];
    if (cat === 'cheese') {
      catItems = byCat[cat].slice().sort((a,b) => CHEESE_ORDER.indexOf(a.group) - CHEESE_ORDER.indexOf(b.group));
    }
    let lastGroup = null;
    const cgN = (state.lang === 'en') ? CHEESE_GROUPS_EN : CHEESE_GROUPS;
    for (const ing of catItems) {
      // Cheese subheading
      if (cat === 'cheese' && ing.group !== lastGroup) {
        lastGroup = ing.group;
        const fatg = CHEESE_FAT[ing.group];
        html += `<div class="settings-subcat-title">🧀 ${cgN[ing.group] || ing.group}${fatg != null ? ` · ~${fatg}% ${T('refLabel')}` : ''}</div>`;
      }
      const f = state.filters[ing.id] || {enabled: true};
      const isOff = f.enabled === false;
      const alts = getAlternatives(ing.id);  // ONLY enabled options
      const chosenAlt = f.altId ? getIngredient(f.altId) : null;
      const chosenAltStillEnabled = f.altId && isEnabled(f.altId);
      const autoAlt = (isOff && !chosenAltStillEnabled) ? (resolveIngredient(ing.id)) : null;
      const showAutoAlt = autoAlt && autoAlt.id !== ing.id;
      html += `<div class="ingredient-row ${isOff ? 'disabled' : ''}">
        <div>
          <div class="name">${ingName(ing)}</div>
          ${packSummary(ing)}
          ${isOff && chosenAlt && chosenAltStillEnabled ?
            `<div class="alt-display">${T('altInstead')}: ${ingName(chosenAlt)}</div>` : ''}
          ${isOff && chosenAlt && !chosenAltStillEnabled ?
            `<div class="alt-display" style="color:var(--orange)">${T('altDisabledWarn')} «${ingName(chosenAlt)}» ${T('altDisabledSuffix')}${showAutoAlt ? ` ${T('altDisabledFallback')}: ${ingName(autoAlt)}` : ''}</div>` : ''}
          ${isOff && !chosenAlt && alts.length ?
            `<div class="alt-display">${T('altPick')} (${alts.length} ${T('altAvailable')})</div>` : ''}
          ${isOff && !chosenAlt && !alts.length ?
            `<div class="alt-display" style="color:var(--red)">${T('noAlts')}</div>` : ''}
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          ${isOff && alts.length ? `<button class="btn btn-ghost btn-sm" onclick="openAltPicker('${ing.id}')">${T('altBtn')}</button>` : ''}
          <button class="btn btn-ghost btn-sm" onclick="openPackModal('${ing.id}')" title="${T('packBtn')}">📦</button>
          ${ing.id.startsWith('custom_') ? `<button class="btn btn-ghost btn-sm" style="color:var(--red);border-color:var(--red)" onclick="deleteCustomFood('${ing.id}')">\ud83d\uddd1</button>` : ''}
          <div class="switch ${isOff ? '' : 'on'}" onclick="toggleFilter('${ing.id}')"></div>
        </div>
      </div>`;
    }
    html += `</div>`;   // close .cat-body
    html += `</div>`;   // close .card
  }

  html += `</div>`;   // close .settings-cat-grid

  // Stores management
  html += `<div class="card">
    <h3 style="margin:0 0 10px;font-size:14px;color:var(--navy)">🏬 ${T('storesTitle')}</h3>
    <div class="subtle" style="margin-bottom:10px">${T('storesHelp')}</div>`;
  const fav = getFavoriteStore();
  for (const s of getAllStores()) {
    const isFav = s.id === fav;
    const isCustom = s.id.startsWith('custom_');
    html += `<div class="ingredient-row">
      <div>
        <div class="name">🏬 ${s.name} ${isFav ? `<span class="store-fav-badge">${T('favorite')}</span>` : ''}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        ${!isFav ? `<button class="btn btn-ghost btn-sm" onclick="setFavoriteStore('${s.id}')">⭐ ${T('setFav')}</button>` : `<button class="btn btn-ghost btn-sm" onclick="setFavoriteStore(null)">${T('clearFav')}</button>`}
        <button class="btn btn-ghost btn-sm" onclick="openMapsSearch('${s.name.replace(/'/g,"\\'")}')">🧭</button>
        ${isCustom ? `<button class="btn btn-ghost btn-sm" onclick="deleteCustomStore('${s.id}')" style="color:var(--red);border-color:var(--red)">🗑</button>` : ''}
      </div>
    </div>`;
  }
  html += `<button class="btn btn-block" style="margin-top:10px" onclick="addCustomStore()">➕ ${T('addStore')}</button></div>`;

  // Backup section
  const _bs = backupStats();
  html += `<div class="card">
    <h3 style="margin:0 0 10px;font-size:14px;color:var(--navy)">💾 ${T('backupTitle')}</h3>
    <div class="subtle" style="margin-bottom:10px">${T('backupHelp')}</div>
    <div class="subtle" style="margin-bottom:10px;padding:8px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">
      <div><strong>${T('backupStats')}:</strong> ${_bs.days} ${T('backupDays')} · ${_bs.profiles} ${T('backupProfiles')}</div>
      <div style="margin-top:3px">${_bs.last ? T('backupLast') + ': ' + _bs.last : T('backupNone')}</div>
      <div style="margin-top:5px;font-weight:700;color:${_bs.synced ? 'var(--green)' : 'var(--orange)'}">
        ${_bs.synced ? '☁ ' + T('backupSyncOn') : '⚠ ' + (_bs.syncError ? T('syncError') + ' (' + _bs.syncError + ')' : T('backupSyncOff'))}</div>
      ${_bs.account ? `<div style="margin-top:3px;word-break:break-all"><strong>${T('backupAccount')}:</strong> ${_bs.account}</div>` : ''}
      ${(_bs.merge && (_bs.merge.addedDays || _bs.merge.mergedDays)) ? `<div style="margin-top:5px;color:var(--green)">\u21c4 ${T('backupMerged')}: +${_bs.merge.addedDays} ${T('backupDays')}, ${_bs.merge.mergedDays} ${T('backupMergedUpd')}</div>` : ''}
    </div>
    <button class="btn btn-block" onclick="exportBackup()">⬇ ${T('backupExport')}</button>
    <input type="file" id="backupFileInput" accept="application/json,.json" style="display:none" onchange="importBackupFile(this)">
    <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="document.getElementById('backupFileInput').click()">⬆ ${T('backupImport')}</button>
  </div>`;

  // Reset section
  html += `<div class="card">
    <h3 style="margin:0 0 10px;font-size:14px;color:var(--red)">${T('reset')}</h3>
    <button class="btn btn-secondary btn-block" onclick="resetAll()">${T('resetBtn')}</button>
  </div>`;

  return html;
}

function compareFoodOptions(currentId) {
  const cats = {};
  for (const ing of allIngredients()) {
    if (!ing || !ing.n100) continue;
    if (ing.cat === 'tea' || ing.cat === 'spice') continue;
    if (!cats[ing.cat]) cats[ing.cat] = [];
    cats[ing.cat].push(ing);
  }
  let out = `<option value="">— ${T('chooseFood')} —</option>`;
  for (const cat of Object.keys(CATEGORIES)) {
    if (!cats[cat]) continue;

function resolveStoreId(storeRef) {
  if (!storeRef) return null;
  const all = getAllStores();
  let st = all.find(s => s.id === storeRef);

  st = all.find(s => s.name && s.name.toLowerCase() === String(storeRef).toLowerCase());
  if (st) return st.id;
  if (!state.customStores) state.customStores = [];
  const id = 'custom_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
  state.customStores.push({id, name: String(storeRef)});
  return id;
}

function importPurchases(input) {
  let data = input;
  if (typeof input === 'string') {
    try { data = JSON.parse(input); } catch (e) { alert(T('importBadFormat')); return; }
  }
  let list, ingDefs = null;
  if (Array.isArray(data)) list = data;
  else if (data && Array.isArray(data.purchases)) { list = data.purchases; ingDefs = data.ingredients; }
  else { alert(T('importBadFormat')); return; }
  // Register any new foods carried by the file (so unknown receipt items become trackable)
  if (Array.isArray(ingDefs)) {
    if (!state.customIngredients) state.customIngredients = [];
    for (const ing of ingDefs) {
      if (ing && ing.id && !getIngredient(ing.id)) state.customIngredients.push(Object.assign({custom: true}, ing));
    }
  }
  if (!state.purchases) state.purchases = [];
  if (!state.inventory) state.inventory = {};
  let added = 0;
  const unknown = {};
  for (const rec of list) {
    if (!rec || !rec.ing) continue;
    const _ingObj = getIngredient(rec.ing);
    if (!_ingObj) { unknown[rec.ing] = true; continue; }
    let grams = +rec.grams || 0;
    // Package-aware quantities: boxes / units → internal amount (g or ml)
    const _pk = getPack(_ingObj);
    if (_pk) {
      if (_pk.g) {
        if (rec.boxes != null) grams = (+rec.boxes || 0) * (_pk.perBox || 1) * _pk.g;
        else if (rec.units != null) grams = (+rec.units || 0) * _pk.g;
      } else {
        if (rec.boxes != null) grams = (+rec.boxes || 0) * (_pk.perBox || 0);
        else if (rec.units != null) grams = (+rec.units || 0);
      }
    }
    // Receipt-style: measure (kg|ml|g|pcs) + qty → internal amount (g or ml)
    if (!grams && rec.measure != null && rec.qty != null) {
      const _q = +rec.qty || 0;
      if (rec.measure === 'kg') grams = _q * 1000;
      else if (rec.measure === 'ml' || rec.measure === 'g') grams = _q;
      else if (rec.measure === 'pcs') grams = _q * ((_pk && _pk.g) ? _pk.g : 0);
    }
    const price = +rec.price || 0;
    const date = rec.date || todayISO();
    const storeId = rec.store ? resolveStoreId(rec.store) : null;
    state.purchases.push({date, id: rec.ing, grams, price, unit: rec.unit || '', store: storeId || '',
      measure: rec.measure || '', qty: (rec.qty != null ? +rec.qty : undefined), vat: (rec.vat != null ? +rec.vat : undefined)});
    if (!state.inventory[rec.ing]) state.inventory[rec.ing] = {};
    if (typeof state.inventory[rec.ing] === 'number') state.inventory[rec.ing] = {grams: state.inventory[rec.ing]};
    state.inventory[rec.ing].grams = (state.inventory[rec.ing].grams || 0) + grams;
    if (storeId) { if (!state.itemStores) state.itemStores = {}; state.itemStores[rec.ing] = storeId; }
    added++;
  }
  saveState();
  closeModal();
  render();
  let msg = added + ' ' + T('purchasesImported');
  const unk = Object.keys(unknown);
  if (unk.length) msg += '\n' + T('importUnknown') + ': ' + unk.join(', ');
  alert(msg);
}

  const f = input.files && input.files[0];

  reader.onload = function(e) {
    const nameEl = document.getElementById('ip_name');
    const suggested = (nameEl && nameEl.value || '').trim() || f.name.replace(/\.[^.]+$/, '');

function importPlanFromText(text, suggestedName) {
  let data;
  try { data = JSON.parse(text); } catch (e) { alert(T('importBadFormat')); return; }
  if (!data || typeof data.menus !== 'object' || !Array.isArray(data.weekOrder)) {
    alert(T('importBadFormat'));
    return;
  }
  // Register any ingredient definitions the plan carries (as custom foods)
  if (Array.isArray(data.ingredients)) {
    if (!state.customIngredients) state.customIngredients = [];
    for (const ing of data.ingredients) {
      if (ing && ing.id && !getIngredient(ing.id)) {
        state.customIngredients.push(Object.assign({custom:true}, ing));
      }
    }
  }
  // Find & strip unknown ingredients (ask/ignore policy)
  const unknown = {};
  for (const mk of Object.keys(data.menus)) {
    const menu = data.menus[mk];
    if (!menu) continue;
    for (const meal of Object.values(menu)) {
      if (!meal || !Array.isArray(meal.items)) continue;
      meal.items = meal.items.filter(it => {
        if (it && it.ing && !getIngredient(it.ing)) { unknown[it.ing] = true; return false; }
        return true;
      });
    }
  }
  const plan = {
    id: 'plan_' + Date.now(),
    name: (suggestedName || data.name || ('\u03a0\u03bb\u03ac\u03bd\u03bf ' + ((state.plans||[]).length + 1))),
    menus: data.menus,
    weekOrder: data.weekOrder,
    createdAt: todayISO()
  };
  if (!state.plans) state.plans = [];
  state.plans.push(plan);
  state.activePlanId = plan.id;
  applyActivePlan();
  saveState();
  closeModal();
  render();
  const unk = Object.keys(unknown);
  let msg = T('importDone');
  if (unk.length) msg += '\n' + T('importUnknown') + ': ' + unk.join(', ');
  alert(msg);
}

function deletePlan(id) {
  if (!confirm(T('deletePlanConfirm'))) return;
  state.plans = (state.plans || []).filter(p => p.id !== id);
  if (state.activePlanId === id) { state.activePlanId = null; applyActivePlan(); }
  saveState();
  render();
}

function saveCustomFood() {

  const num = (id) => Math.max(0, Number(document.getElementById(id).value) || 0);
  const food = {
    id: 'custom_' + Date.now(),
    name: name,
    name_en: name,
    cat: cat,
    n100: [num('cf_kcal'), num('cf_carb'), num('cf_prot'), num('cf_fat')],
    custom: true
  };
  // Cheese: assign the nearest fat-% group so it integrates with cheese substitution + scaling
  if (cat === 'cheese' && typeof CHEESE_FAT !== 'undefined') {
    let best = null, bestD = Infinity;
    for (const g of Object.keys(CHEESE_FAT)) {
      const d = Math.abs(CHEESE_FAT[g] - food.n100[3]);
      if (d < bestD) { bestD = d; best = g; }
    }
    if (best) food.group = best;
  }
  if (!state.customIngredients) state.customIngredients = [];
  state.customIngredients.push(food);
  saveState();
  closeModal();
  render();
}

function savePack(id) {
  const val = (eid) => { const e = document.getElementById(eid); return e ? (e.value || '') : ''; };
  const base = (val('pk_base') === 'ml') ? 'ml' : 'g';
  const g = Number(val('pk_g')) || 0;

  const plural = val('pk_plural').trim() || unit;
  const perBox = Number(val('pk_box')) || 0;
  const box = val('pk_boxname').trim();

// Set a meal's eaten state for a specific date; deduct/re-credit stock precisely.
// Mutates state only (no save/render) — callers handle that.
function setMealEatenState(dateISO, mealId, eaten) {
  if (!state.log[dateISO]) state.log[dateISO] = {meals:{}, water:0, weight:null, notes:'', tea:false};
  if (!state.log[dateISO].deducted) state.log[dateISO].deducted = {};
  const log = state.log[dateISO];
  const was = !!(log.meals && log.meals[mealId]);
  if (!log.meals) log.meals = {};
  if (was === eaten) return; // no change
  log.meals[mealId] = eaten;

  const menu = menuForDate(dateISO).menu;
  const meal = menu ? menu[mealId] : null;

  if (eaten) {
    // Deduct from inventory, recording exactly how much was taken
    const ded = {};
    if (meal) {
      for (const item of meal.items) {
        const orig = getIngredient(item.ing);
        const target = resolveForSlot(item, mealId, dateISO) || resolveIngredient(item.ing);
        if (!target || !isEnabled(target.id)) continue;
        let need = effectiveGrams(item, target.id);
        const cur = getInvGrams(target.id);
        if (cur > 0) {
          const take = Math.min(cur, need); // never go negative
          setInvGrams(target.id, cur - take);
          ded[target.id] = (ded[target.id] || 0) + take;
        }
      }
    }
    // also deduct user-added extras
    for (const ex of getMealExtras(dateISO, mealId)) {
      const ing = getIngredient(ex.ing);
      if (!ing || !isEnabled(ing.id)) continue;
      const cur = getInvGrams(ing.id);
      if (cur > 0) {
        const take = Math.min(cur, ex.g || 0);
        setInvGrams(ing.id, cur - take);
        ded[ing.id] = (ded[ing.id] || 0) + take;
      }
    }
    log.deducted[mealId] = ded;
  } else {
    // Re-credit exactly what was deducted earlier
    const ded = log.deducted[mealId];
    if (ded) {
      for (const id of Object.keys(ded)) setInvGrams(id, getInvGrams(id) + ded[id]);
      delete log.deducted[mealId];
    }
  }
}

// ============================================================================
// BACKUP / RESTORE — εξαγωγή και επαναφορά όλων των δεδομένων σε αρχείο JSON
// ============================================================================
const BACKUP_FORMAT = 'omioastasis-backup';
const BACKUP_VERSION = 1;

// Σύνοψη όσων υπάρχουν σε ΑΥΤΗ τη συσκευή (για την κάρτα Ρυθμίσεων)
function backupStats(st) {
  const s = st || state;
  const profs = s.profiles || {};
  let days = new Set(), profiles = 0, last = null;
  for (const id of Object.keys(profs)) {
    const ap = profs[id] || {};
    const lg = ap.log || {};
    const keys = Object.keys(lg);
    if (keys.length) profiles++;   // μόνο όσα έχουν πραγματικές καταχωρήσεις
    for (const d of keys) { days.add(d); if (!last || d > last) last = d; }
  }
  return {
    days: days.size, profiles,
    last, synced: (typeof _cloudHealthy !== 'undefined') && _cloudHealthy,
    syncError: (typeof _cloudError !== 'undefined') ? _cloudError : null,
    account: (typeof window !== 'undefined' && window.fbUser && window.fbUser.email) ? window.fbUser.email : null,
    merge: (typeof _lastMergeStats !== 'undefined') ? _lastMergeStats : null,
    inventory: Object.keys(s.inventory || {}).length,
    purchases: (s.purchases || []).length,
  };
}

function exportBackup() {
  try {
    if (typeof snapshotActiveProfile === 'function') snapshotActiveProfile();
    const payload = {
      format: BACKUP_FORMAT,
      version: BACKUP_VERSION,
      exportedAt: new Date().toISOString(),
      appUrl: (typeof location !== 'undefined' && location.href) ? location.href : '',
      userAgent: (typeof navigator !== 'undefined' && navigator.userAgent) ? navigator.userAgent : '',
      stats: backupStats(),
      state: JSON.parse(JSON.stringify(state)),
    };
    const d = new Date();
    const pad = x => String(x).padStart(2, '0');
    const name = 'omioostasis-backup-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate())
                 + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
    const blob = new Blob([JSON.stringify(payload, null, 1)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 1000);
    if (typeof toast === 'function') toast('✓ ' + T('exportOk')); else alert('✓ ' + T('exportOk'));
  } catch (e) {
    console.error('export failed:', e);
    alert('Export failed: ' + e.message);
  }
}

// Δέχεται είτε το πλήρες αρχείο αντιγράφου είτε σκέτο state (ανεκτικό στο σχήμα)
function _looksLikeState(x) {
  return !!(x && typeof x === 'object' && x.profiles && typeof x.profiles === 'object'
            && Object.keys(x.profiles).length > 0
            && Object.values(x.profiles).every(p => p && typeof p === 'object'));
}
function _extractBackupState(obj) {
  if (!obj || typeof obj !== 'object') return null;
  const cands = [];
  if (obj.format === BACKUP_FORMAT && obj.state) cands.push(obj.state);
  if (obj.state) cands.push(obj.state);   // έγγραφο Firestore
  cands.push(obj);                        // σκέτο state
  for (const c of cands) if (_looksLikeState(c)) return c;
  return null;
}

function importBackupFile(input) {
  const file = input && input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    input.value = '';  // ώστε να ξαναδουλεύει με το ίδιο αρχείο
    let parsed = null;
    try { parsed = JSON.parse(reader.result); } catch (e) { alert(T('importBad')); return; }
    const incoming = _extractBackupState(parsed);
    if (!incoming) { alert(T('importBad')); return; }
    const inc = backupStats(incoming), cur = backupStats();
    const when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString() : '—';
    const row = (lbl, st, extra) => `<div style="padding:8px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin-bottom:8px">
        <div style="font-weight:700">${lbl}</div>
        <div class="subtle">${st.days} ${T('backupDays')} · ${st.profiles} ${T('backupProfiles')}</div>
        <div class="subtle">${st.last ? T('backupLast') + ': ' + st.last : T('backupNone')}</div>
        ${extra ? `<div class="subtle">${extra}</div>` : ''}
      </div>`;
    window.__pendingImport = incoming;
    document.getElementById('modalContainer').innerHTML = `<div class="modal-backdrop" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <h2>⬆ ${T('importTitle')}</h2>
        ${row('📄 ' + T('importSummary'), inc, when)}
        ${row('📱 ' + T('importCurrent'), cur, '')}
        <div style="padding:10px;border-radius:8px;background:rgba(220,80,60,.12);color:var(--red);font-weight:700;margin-bottom:12px">
          ⚠ ${T('importWarn')}</div>
        <button class="btn btn-block" style="background:var(--red);border-color:var(--red)" onclick="confirmImportBackup()">${T('importConfirmBtn')}</button>
        <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="closeModal()">${T('cancel')}</button>
      </div></div>`;
  };
  reader.onerror = () => { alert(T('importBad')); };
  reader.readAsText(file);
}

function confirmImportBackup() {
  const incoming = window.__pendingImport;
  if (!incoming) return;
  const _prev = localStorage.getItem('omioastasis_state');  // δίχτυ ασφαλείας
  try {
    localStorage.setItem('omioastasis_state', JSON.stringify(incoming));
    state = loadState();
    if (typeof applyActivePlan === 'function') applyActivePlan();
    saveState();
    window.__pendingImport = null;
    closeModal();
    render();
    if (typeof renderProfileBar === 'function') renderProfileBar();
    if (typeof toast === 'function') toast('✓ ' + T('importOk')); else alert(T('importOk'));
  } catch (e) {
    // Επαναφορά της προηγούμενης κατάστασης — καλύτερα τα παλιά δεδομένα παρά κανένα.
    console.error('import failed, rolling back:', e);
    try {
      if (_prev !== null) localStorage.setItem('omioastasis_state', _prev);
      else localStorage.removeItem('omioastasis_state');
      state = loadState();
      if (typeof applyActivePlan === 'function') applyActivePlan();
      render();
    } catch (e2) { console.error('rollback failed:', e2); }
    closeModal();
    alert(T('importBad'));
  }
}

// Export tracker data to CSV (downloads a file)
function exportTrackerCSV() {
  const rows = [];
  // Header
  rows.push(['Ημερομηνία/Date','Ημέρα/Day','Μενού/Menu','Γεύμα/Meal','Ολοκληρώθηκε/Done','Ώρα/Time','kcal','Carbs(g)','Protein(g)','Fat(g)']);

  const dates = Object.keys(state.log || {}).sort();
  for (const date of dates) {
    const log = state.log[date];
    if (!log) continue;
    const dObj = new Date(date + 'T00:00:00');
    const dayIdx = (dObj.getDay() + 6) % 7;
    const dayName = (I18N.el.days[dayIdx]);
    const menuKey = WEEK_ORDER[dayIdx];
    const menu = MENUS[menuKey];
    for (const mt of MEAL_TYPES) {
      const meal = menu[mt.id];
      if (!meal) continue;
      const done = (log.meals && log.meals[mt.id]) ? 'ΝΑΙ' : '';
      const time = (log.mealAtTime && log.mealAtTime[mt.id]) || '';
      const m = macrosForMeal(meal, mt.id, menuKey, date);
      rows.push([date, dayName, menuKey, I18N.el.mealTypesFull[mt.id], done, time,
                 Math.round(m.cal), m.c.toFixed(1), m.p.toFixed(1), m.f.toFixed(1)]);
    }
    // Daily extras row
    rows.push([date, dayName, menuKey, '— Σύνολο ημέρας —',
               '', '', '', '',
               'Νερό: ' + (log.water || 0) + '/9',
               'Βάρος: ' + (log.weight || '-') + ' kg']);
  }

  // Stats summary
  rows.push([]);
  rows.push(['=== ΣΤΑΤΙΣΤΙΚΑ / STATS ===']);
  rows.push(['Σύνολο δαπανών (€)', getTotalSpent().toFixed(2)]);
  rows.push(['Αξία καταναλωθέντων (€)', getConsumedValue().toFixed(2)]);
  rows.push([]);
  rows.push(['=== ΑΓΟΡΕΣ / PURCHASES ===']);
  rows.push(['Ημερομηνία','Προϊόν','Ποσότητα','Τιμή(€)']);
  for (const p of (state.purchases || [])) {
    const ing = getIngredient(p.id);
    rows.push([p.date, ing ? ing.name : p.id, p.unit || (p.grams + 'g'), (p.price||0).toFixed(2)]);
  }

  // Build CSV string
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell == null ? '' : cell);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');

  // BOM for Excel UTF-8 + download
  const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'diatrofi_tracker_' + todayISO() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Long-press handler for ingredient substitution
let _lpTimer = null;
let _lpFired = false;
let _lpStartX = 0, _lpStartY = 0;
let _lpEl = null;

function _startLP(target, x, y) {
  const el = target && target.closest && target.closest('.ingredient-lp');
  if (!el) return;
  _lpFired = false;
  _lpEl = el;
  _lpStartX = x;
  _lpStartY = y;
  if (_lpTimer) clearTimeout(_lpTimer);
  _lpTimer = setTimeout(() => {
    _lpFired = true;
    _lpTimer = null;
    const ing = el.getAttribute('data-ing');
    const meal = el.getAttribute('data-meal');
    const date = el.getAttribute('data-date');
    if (ing && meal && date) {
      navigator.vibrate && navigator.vibrate(30);
      openIngredientSubModal(ing, meal, date);
    }
  }, 500);
}

function _cancelLP() {
  if (_lpTimer) { clearTimeout(_lpTimer); _lpTimer = null; }
}

function _moveLP(x, y) {
  if (!_lpTimer) return;
  const dx = x - _lpStartX;
  const dy = y - _lpStartY;
  if (dx*dx + dy*dy > 100) _cancelLP(); // moved > 10px
}

// Touch events (primary for mobile)
document.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    _startLP(e.target, e.touches[0].clientX, e.touches[0].clientY);
  }
}, {passive: true});
document.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1) {
    _moveLP(e.touches[0].clientX, e.touches[0].clientY);
  }
}, {passive: true});
document.addEventListener('touchend', () => _cancelLP(), {passive: true});
document.addEventListener('touchcancel', () => _cancelLP(), {passive: true});

// Mouse events (desktop)
document.addEventListener('mousedown', (e) => _startLP(e.target, e.clientX, e.clientY));
document.addEventListener('mousemove', (e) => _moveLP(e.clientX, e.clientY));
document.addEventListener('mouseup', () => _cancelLP());

// Prevent context menu after fired LP
document.addEventListener('contextmenu', (e) => {
  if (_lpFired) { e.preventDefault(); _lpFired = false; }
});

function renderMenuMealEditable(meal, mealId, menuKey) {

function openMenuSubModal(origIngId, mealId, menuKey) {
  const orig = getIngredient(origIngId);
  if (!orig) return;
  const isCheese = orig.cat === 'cheese';
  let origGrams = 0;
  const meal = MENUS[menuKey] && MENUS[menuKey][mealId];
  const _item = meal ? meal.items.find(x => x.ing === origIngId) : null;
  if (_item) origGrams = _item.g;
  const explicitEntries = altEntriesExplicit(origIngId, _item);
  let alts;
  if (isCheese) {
    // Το ΑΡΧΙΚΟ τυρί του προγράμματος μπαίνει πάντα στη λίστα — ακόμη κι αν είναι
    // απενεργοποιημένο στα φίλτρα — ώστε να μπορεί πάντα να επιλεγεί ξανά.
    alts = allIngredients().filter(i => i.cat === 'cheese' && (i.id === origIngId || isEnabled(i.id)));
  } else {
    alts = allIngredients().filter(i =>
      i.id === origIngId ? true
      : isEnabled(i.id) && ((i.group && i.group === orig.group) || (i.custom && i.cat === orig.cat)));
  }
  const cur = getMenuSub(menuKey, mealId, origIngId);
  const isNone = !cur;
  const cgNames = (state.lang === 'en') ? CHEESE_GROUPS_EN : CHEESE_GROUPS;
  const menuLabel = (MENUS[menuKey] && MENUS[menuKey].label) || menuKey;
  let html = `<div class="modal-backdrop" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h2>\ud83d\udd04 ${T('menuSubTitle')}</h2>
      <div class="subtle" style="margin-bottom:6px">${T('menuSubDesc')} <strong>${ingName(orig)}</strong>${origGrams ? ' (' + origGrams + ' g)' : ''}</div>
      <div class="subtle" style="margin-bottom:12px;color:var(--accent)">\ud83d\udccb ${T('menuSubScope')}: ${menuLabel} \u00b7 ${T('mealTypesFull')[mealId] || mealId}</div>`;
  html += `<div class="alt-option ${isNone ? 'selected' : ''}" onclick="setMenuSub('${menuKey}','${mealId}','${origIngId}', null)">
    <div><strong>\u21ba ${T('menuSubNone')}</strong><div class="pct">${ingName(orig)}</div></div>
    <span>${isNone ? '\u2713' : ''}</span></div>`;
  if (explicitEntries) {
    for (const e of explicitEntries) {
      const alt = getIngredient(e.id); if (!alt) continue;
      const sel = cur === e.id ? 'selected' : '';
      const g = (e.g != null) ? e.g
        : ((isCheese && alt.cat === 'cheese' && origGrams) ? cheeseScaledGrams(origIngId, e.id, origGrams) : origGrams);
      const gTxt = (g && g !== origGrams) ? ` <span style="color:var(--orange);font-weight:700">\u2192 ${g} g</span>` : '';
      html += `<div class="alt-option ${sel}" onclick="setMenuSub('${menuKey}','${mealId}','${origIngId}','${e.id}')">
        <div><strong>${ingName(alt)}</strong>${gTxt}
          ${alt.n100 ? `<div class="pct">${alt.n100[0]} kcal \u00b7 ${alt.n100[2]}g protein \u00b7 ${alt.n100[3]}g fat /100g</div>` : ''}</div>
        <span>${sel ? '\u2713' : ''}</span></div>`;
    }
  } else if (isCheese) {
    for (const grp of CHEESE_ORDER) {
      const members = alts.filter(a => a.group === grp);
      if (!members.length) continue;
      html += `<div class="subtle" style="margin:10px 0 4px;font-weight:600;color:var(--navy)">\ud83e\uddc0 ${cgNames[grp] || grp}</div>`;
      for (const alt of members) {
        const isOrig = alt.id === origIngId;
        const sel = (isOrig ? !cur : cur === alt.id) ? 'selected' : '';
        const scaled = (!isOrig && origGrams) ? cheeseScaledGrams(origIngId, alt.id, origGrams) : 0;
        const badge = isOrig ? ` <span style="font-size:11px;color:var(--accent);font-weight:700">(${T('origBadge')})</span>` : '';
        html += `<div class="alt-option ${sel}" onclick="setMenuSub('${menuKey}','${mealId}','${origIngId}','${alt.id}')">
          <div><strong>${ingName(alt)}</strong>${badge}${scaled ? ` <span style="color:var(--orange);font-weight:700">\u2192 ${scaled} g</span>` : ''}</div>
          <span>${sel ? '\u2713' : ''}</span></div>`;
      }
    }
  } else {
    for (const alt of alts) {
      const sel = cur === alt.id ? 'selected' : '';
      const isOrig = alt.id === origIngId;
      html += `<div class="alt-option ${sel}" onclick="setMenuSub('${menuKey}','${mealId}','${origIngId}','${alt.id}')">
        <div><strong>${ingName(alt)}</strong>${isOrig ? ` <span style="font-size:11px;color:var(--accent);font-weight:600">(${T('origBadge')})</span>` : ''}
          ${alt.n100 ? `<div class="pct">${alt.n100[0]} kcal \u00b7 ${alt.n100[2]}g protein \u00b7 ${alt.n100[3]}g fat /100g</div>` : ''}</div>
        <span>${sel ? '\u2713' : ''}</span></div>`;
    }
  }
  if (!explicitEntries && alts.length === 0) html += `<div class="subtle" style="padding:12px 0">${T('noAvailableAlts')}</div>`;
  html += `<button class="btn btn-secondary btn-block" style="margin-top:10px" onclick="closeModal()">${T('cancel')}</button></div></div>`;
  document.getElementById('modalContainer').innerHTML = html;
}

function openIngredientSubModal(origIngId, mealId, dateISO) {
  const orig = getIngredient(origIngId);
  if (!orig) return;
  const isCheese = orig.cat === 'cheese';
  const origGrams = getMealItemGrams(mealId, origIngId, dateISO);
  const _menuD = menuForDate(dateISO).menu;
  const _mealD = _menuD ? _menuD[mealId] : null;
  const _item = _mealD ? _mealD.items.find(x => x.ing === origIngId) : null;
  const explicitEntries = altEntriesExplicit(origIngId, _item);

  // Effective default: if orig is disabled, show the substitute as default
  const f = state.filters[origIngId];
  const origDisabled = f && f.enabled === false;
  const effDefault = origDisabled ? (resolveIngredient(origIngId) || orig) : orig;
  const defaultDiffers = effDefault.id !== orig.id;

  // Alternatives:
  // - Cheese: ALL enabled cheeses (cross-category), grouped by fat %
  // - Else: same group, enabled
  let alts;
  if (isCheese) {
    // Το ΑΡΧΙΚΟ τυρί του προγράμματος μπαίνει πάντα στη λίστα — ακόμη κι αν είναι
    // απενεργοποιημένο στα φίλτρα — ώστε να μπορεί πάντα να επιλεγεί ξανά.
    alts = allIngredients().filter(i => i.cat === 'cheese' && (i.id === origIngId || isEnabled(i.id)));
  } else {
    alts = allIngredients().filter(i =>
      i.id === origIngId ? true
      : isEnabled(i.id) && ((i.group && i.group === orig.group) || (i.custom && i.cat === orig.cat))
    );
  }
  const imonAlts = getImonAlternatives(origIngId);
  const currentSub = getDailySubstitute(dateISO, mealId, origIngId);
  const currentTextSub = getDailyTextSub(dateISO, mealId, origIngId);
  const isDefault = !currentSub && !currentTextSub;
  const cgNames = (state.lang === 'en') ? CHEESE_GROUPS_EN : CHEESE_GROUPS;

  let html = `<div class="modal-backdrop" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h2>🔄 ${T('quickSubTitle')}</h2>
      <div class="subtle" style="margin-bottom:8px">${T('quickSubDesc')} <strong>${ingName(orig)}</strong>${origGrams ? ' (' + origGrams + ' g)' : ''}</div>
      ${isCheese ? `<div class="subtle" style="margin-bottom:8px;color:var(--accent)">⚖ ${T('cheeseScaleNote')}</div>` : ''}
      <div class="subtle" style="margin-bottom:12px">${T('forThisMeal')}</div>`;
  // Top "Automatic" option: shows the REAL auto result (filter substitute + variety rotation)
  const autoIng = effectiveAutoIngredient(origIngId, mealId, dateISO) || effDefault;
  const autoNote = origDisabled ? T('autoSub') : (autoIng.id !== orig.id ? T('autoRotateNote') : '');
  html += `<div class="alt-option ${isDefault ? 'selected' : ''}" onclick="setDailySubstitute('${dateISO}', '${mealId}', '${origIngId}', null)">
    <div><strong>↺ ${T('autoPick')}</strong>
      <div class="pct">${ingName(autoIng)}${autoNote ? ' · ' + autoNote : ''}</div></div>
    <span>${isDefault ? '✓' : ''}</span>
  </div>`;
  // Alternatives — explicit dietitian rule first, else cheese/group fallback
  if (explicitEntries) {
    for (const e of explicitEntries) {
      const alt = getIngredient(e.id); if (!alt) continue;
      const sel = currentSub === e.id ? 'selected' : '';
      const g = (e.g != null) ? e.g
        : ((isCheese && alt.cat === 'cheese' && origGrams) ? cheeseScaledGrams(origIngId, e.id, origGrams) : origGrams);
      const gTxt = (g && g !== origGrams) ? ` <span style="color:var(--orange);font-weight:700">→ ${g} g</span>` : '';
      html += `<div class="alt-option ${sel}" onclick="setDailySubstitute('${dateISO}', '${mealId}', '${origIngId}', '${e.id}')">
        <div><strong>${ingName(alt)}</strong>${gTxt}
          ${alt.n100 ? `<div class="pct">${alt.n100[0]} kcal · ${alt.n100[2]}g protein · ${alt.n100[3]}g fat /100g</div>` : ''}
        </div><span>${sel ? '✓' : ''}</span>
      </div>`;
    }
  } else if (alts.length > 0) {
    if (isCheese) {
      // Group by fat category
      for (const grp of CHEESE_ORDER) {
        const members = alts.filter(a => a.group === grp);
        if (members.length === 0) continue;
        html += `<div class="subtle" style="margin:10px 0 4px;font-weight:600;color:var(--navy)">🧀 ${cgNames[grp] || grp}</div>`;
        for (const alt of members) {
          const isOrig = alt.id === origIngId;
          const sel = (isOrig ? !currentSub : currentSub === alt.id) ? 'selected' : '';
          const scaled = (!isOrig && origGrams) ? cheeseScaledGrams(origIngId, alt.id, origGrams) : 0;
          const badge = isOrig ? ` <span style="font-size:11px;color:var(--accent);font-weight:700">(${T('origBadge')})</span>` : '';
          html += `<div class="alt-option ${sel}" onclick="setDailySubstitute('${dateISO}', '${mealId}', '${origIngId}', '${alt.id}')">
            <div><strong>${ingName(alt)}</strong>${badge}${scaled ? ` <span style="color:var(--orange);font-weight:700">→ ${scaled} g</span>` : ''}
              ${alt.n100 ? `<div class="pct">${alt.n100[0]} kcal · ${alt.n100[2]}g protein · ${alt.n100[3]}g fat /100g</div>` : ''}
            </div>
            <span>${sel ? '✓' : ''}</span>
          </div>`;
        }
      }
    } else {
      for (const alt of alts) {
        const sel = currentSub === alt.id ? 'selected' : '';
        const isOrig = alt.id === origIngId;
        html += `<div class="alt-option ${sel}" onclick="setDailySubstitute('${dateISO}', '${mealId}', '${origIngId}', '${alt.id}')">
          <div><strong>${ingName(alt)}</strong>${isOrig ? ` <span style="font-size:11px;color:var(--accent);font-weight:600">(${T('origBadge')})</span>` : ''}
            ${alt.n100 ? `<div class="pct">${alt.n100[0]} kcal · ${alt.n100[2]}g protein · ${alt.n100[3]}g fat (per 100g)</div>` : ''}
          </div>
          <span>${sel ? '✓' : ''}</span>
        </div>`;
      }
    }
  }
  if (imonAlts.length > 0) {
    html += `<div class="subtle" style="margin:14px 0 6px;font-weight:600;color:var(--accent)">📖 ${T('emergencyAltsHeader')}</div>`;
    for (let i = 0; i < imonAlts.length; i++) {
      const txt = imonAlts[i];
      const sel = currentTextSub === txt ? 'selected' : '';
      const escapedTxt = txt.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
      html += `<div class="alt-option ${sel}" onclick="setDailyTextSub('${dateISO}', '${mealId}', '${origIngId}', '${escapedTxt}')">
        <div><strong>📝 ${T('emergencyOption')} ${i+1}</strong>
          <div class="pct" style="white-space:normal;line-height:1.4">${txt}</div></div>
        <span>${sel ? '✓' : ''}</span>
      </div>`;
    }
  }
  if (!explicitEntries && alts.length === 0 && imonAlts.length === 0) {
    html += `<div class="subtle" style="padding:12px 0">${T('noAvailableAlts')}</div>`;
  }
  html += `<button class="btn btn-secondary btn-block" style="margin-top:10px" onclick="closeModal()">${T('cancel')}</button></div></div>`;
  document.getElementById('modalContainer').innerHTML = html;
}

// Initial render (with error recovery)
try {
  migrateInventory();
  applyActivePlan();
  applyTheme();
  applyI18n();
  render();
  maybeShowForecastAlert();
} catch (e) {
  var app = document.getElementById('app');
  if (app) {
    app.innerHTML = '<div style="padding:20px;font-family:sans-serif;color:#c00">'
      + '<h3>⚠ Σφάλμα φόρτωσης</h3>'
      + '<p style="font-size:13px">' + (e && e.message ? e.message : e) + '</p>'
      + '<button style="padding:10px;margin-top:10px" onclick="localStorage.removeItem(\'omioastasis_state\');location.reload()">↺ Επαναφορά δεδομένων &amp; επαναφόρτωση</button>'
      + '</div>';
  }
}
</script>
