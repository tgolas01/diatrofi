<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#1F3A5F">
<title>Διατροφή ΟΜΟΙΟΣΤΑΣΙΣ</title>
<style>
:root {
  --bg: #ffffff;
  --bg-2: #f5f7fa;
  --bg-3: #e9eef5;
  --fg: #1a1a1a;
  --fg-2: #555;
  --fg-3: #888;
  --navy: #1F3A5F;
  --accent: #2E75B6;
  --green: #1E883F;
  --red: #C0392B;
  --orange: #D68910;
  --border: #d9dde3;
  --card: #ffffff;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --strike: #C0392B;
  --highlight: #FFF7D6;
  --tab-active: #1F3A5F;
  --tab-inactive: #888;
  --safe-bottom: env(safe-area-inset-bottom, 0);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116;
    --bg-2: #161b22;
    --bg-3: #21262d;
    --fg: #e6edf3;
    --fg-2: #b8c0c8;
    --fg-3: #8b949e;
    --navy: #58a6ff;
    --accent: #58a6ff;
    --green: #3FB950;
    --red: #F85149;
    --orange: #D29922;
    --border: #30363d;
    --card: #161b22;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
    --strike: #F85149;
    --highlight: #3a2f10;
    --tab-active: #58a6ff;
    --tab-inactive: #8b949e;
  }
}
[data-theme="light"] {
  --bg: #ffffff; --bg-2: #f5f7fa; --bg-3: #e9eef5;
  --fg: #1a1a1a; --fg-2: #555; --fg-3: #888;
  --navy: #1F3A5F; --accent: #2E75B6; --green: #1E883F;
  --red: #C0392B; --orange: #D68910; --border: #d9dde3;
  --card: #ffffff; --shadow: 0 1px 3px rgba(0,0,0,.08);
  --strike: #C0392B; --highlight: #FFF7D6;
  --tab-active: #1F3A5F; --tab-inactive: #888;
}
[data-theme="dark"] {
  --bg: #0e1116; --bg-2: #161b22; --bg-3: #21262d;
  --fg: #e6edf3; --fg-2: #b8c0c8; --fg-3: #8b949e;
  --navy: #58a6ff; --accent: #58a6ff; --green: #3FB950;
  --red: #F85149; --orange: #D29922; --border: #30363d;
  --card: #161b22; --shadow: 0 1px 3px rgba(0,0,0,.4);
  --strike: #F85149; --highlight: #3a2f10;
  --tab-active: #58a6ff; --tab-inactive: #8b949e;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.4;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(70px + var(--safe-bottom));
  min-height: 100vh;
}

/* Header */
.app-header {
  background: var(--navy);
  color: #fff;
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
[data-theme="dark"] .app-header,
@media (prefers-color-scheme: dark) {
  .app-header { background: #161b22; border-bottom: 1px solid var(--border); }
}
.app-header h1 {
  font-size: 17px;
  margin: 0;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.app-header .subtitle {
  font-size: 12px;
  opacity: .8;
  margin-top: 2px;
}
.theme-btn {
  background: rgba(255,255,255,.15);
  color: #fff;
  border: none;
  padding: 6px 10px;
  border-radius: 16px;
  font-size: 12px;
  cursor: pointer;
}

/* Profile bar */
.profile-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-2); border-bottom: 1px solid var(--border);
  padding: 6px 12px; font-size: 14px;
}
.profile-bar .profile-icon { font-size: 18px; }
.profile-bar select {
  flex: 1 1 auto; max-width: 240px;
  padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--fg); font-size: 14px;
}
.profile-bar .profile-edit-btn {
  background: transparent; border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 8px; font-size: 14px; cursor: pointer; color: var(--fg);
}
.profile-bar .profile-cloud-badge {
  font-size: 11px; font-weight: 600;
  color: #fff; background: #1f7a3a; padding: 2px 8px; border-radius: 10px;
}
.profile-bar .profile-admin-badge {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  color: #fff; background: var(--orange); padding: 2px 6px; border-radius: 10px;
}

/* Container */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 12px;
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--navy);
  margin: 0 0 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.day-badge {
  font-size: 11px;
  padding: 3px 8px;
  background: var(--accent);
  color: white;
  border-radius: 10px;
  font-weight: 600;
}

/* Meal item */
.meal {
  border-left: 3px solid var(--accent);
  padding: 8px 12px;
  background: var(--bg-2);
  border-radius: 6px;
  margin-bottom: 8px;
}
.meal-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}
.meal-name {
  font-weight: 600;
  font-size: 13px;
  color: var(--navy);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.meal-time {
  font-size: 12px;
  color: var(--fg-3);
}
.meal-content {
  font-size: 14px;
  color: var(--fg);
}
.meal-macros {
  display: flex;
  gap: 12px;
  margin-top: 6px;
  font-size: 11px;
  color: var(--fg-2);
  flex-wrap: wrap;
}
.meal-macros span {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.macro-cal { color: var(--orange); font-weight: 600; }
.macro-c { color: var(--accent); }
.macro-p { color: var(--green); }
.macro-f { color: var(--fg-2); }

/* Ingredient styling */
.ingredient {
  display: inline;
}
.ingredient.strike {
  text-decoration: line-through;
  color: var(--strike);
}
.ingredient.replacement {
  color: var(--green);
  font-weight: 600;
}

/* Tab nav */
.tab-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  padding-bottom: var(--safe-bottom);
}
.tab-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--tab-inactive);
  padding: 9px 2px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 9.5px;
  font-weight: 500;
  transition: color .15s;
  min-width: 0;
}
.tab-btn span:not(.tab-icon) {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.tab-btn { position: relative; }
.tab-btn.active {
  color: var(--tab-active);
  font-weight: 700;
}
.tab-btn.active .tab-icon { transform: scale(1.14); }
.tab-btn.active::before {
  content: '';
  position: absolute;
  top: 0; left: 18%; right: 18%;
  height: 3px;
  background: var(--tab-active);
  border-radius: 0 0 4px 4px;
}
.tab-icon {
  font-size: 18px;
  line-height: 1;
}

/* Buttons */
button, .btn {
  font-family: inherit;
  cursor: pointer;
}
.btn {
  background: var(--navy);
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-secondary {
  background: var(--bg-3);
  color: var(--fg);
}
.btn-ghost {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
}
.btn-sm {
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 6px;
}
.btn-block {
  width: 100%;
  justify-content: center;
}
.btn-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.chip {
  background: var(--bg-3);
  color: var(--fg-2);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.chip.active {
  background: var(--navy);
  color: white;
  border-color: var(--navy);
}
.chip-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* Day navigation pills */
.day-pills {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 12px;
}
.day-pill {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 4px;
  text-align: center;
  cursor: pointer;
  transition: all .15s;
  font-size: 11px;
}
.day-pill .day-letter {
  font-weight: 700;
  font-size: 13px;
  display: block;
  color: var(--fg);
}
.day-pill .day-date {
  display: block;
  font-size: 10px;
  color: var(--fg-2);
  margin-top: 1px;
}
.day-pill .day-menu {
  font-size: 10px;
  color: var(--fg-3);
  margin-top: 2px;
}
.day-pill .day-diet-n {
  display: inline-block;
  font-size: 9px;
  background: var(--orange);
  color: white;
  padding: 1px 5px;
  border-radius: 6px;
  margin-top: 2px;
}
.day-pill.active {
  background: var(--navy);
  color: white;
}
.day-pill.active .day-letter,
.day-pill.active .day-menu { color: white; }
.day-pill.today {
  border-color: var(--orange);
  border-width: 2px;
}
.week-nav {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; margin-bottom: 12px;
}
.week-nav-btn {
  background: var(--bg-3); border: 1px solid var(--border); color: var(--fg);
  border-radius: 8px; min-width: 40px; height: 38px; font-size: 18px;
  cursor: pointer; flex: 0 0 auto;
}
.week-nav-btn:active { background: var(--navy); color: #fff; }
.week-nav-label { flex: 1 1 auto; text-align: center; }
.week-nav-title { font-weight: 700; color: var(--navy); font-size: 14px; }
.week-nav-range { font-size: 11px; color: var(--fg-2); margin-top: 1px; }
.card.week-today { border-left: 4px solid var(--orange); }

/* Tables */
table.simple {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.simple th, table.simple td {
  padding: 6px 8px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
table.simple th {
  background: var(--bg-2);
  font-weight: 600;
  font-size: 12px;
  color: var(--fg-2);
}

/* Shopping list */
.shop-category {
  margin-bottom: 14px;
}
.shop-category h3 {
  font-size: 13px;
  color: var(--navy);
  margin: 0 0 6px;
  padding-bottom: 4px;
  border-bottom: 2px solid var(--accent);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.shop-item {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.shop-item.done .shop-name {
  text-decoration: line-through;
  color: var(--fg-3);
}
.shop-checkbox {
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--green);
}
.shop-name {
  font-weight: 500;
}
.shop-sub {
  font-size: 11px;
  color: var(--fg-3);
  margin-top: 2px;
}
.shop-brands {
  font-size: 11px;
  color: var(--green);
  margin-top: 4px;
  line-height: 1.4;
  font-style: italic;
}
.shop-qty {
  font-size: 12px;
  color: var(--navy);
  font-weight: 600;
  white-space: nowrap;
  text-align: right;
}
.shop-qty .needed {
  color: var(--accent);
  font-size: 11px;
  display: block;
}

/* Settings */
.settings-section {
  margin-bottom: 18px;
}
.ingredient-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px;
  background: var(--bg-2);
  border-radius: 8px;
  margin-bottom: 6px;
  gap: 12px;
}
.ingredient-row.disabled {
  background: rgba(192, 57, 43, .08);
}
.ingredient-row .name {
  flex: 1;
  font-size: 14px;
}
.ingredient-row.disabled .name {
  text-decoration: line-through;
  color: var(--strike);
}
.alt-display {
  font-size: 12px;
  color: var(--green);
  font-weight: 600;
  margin-top: 2px;
}

.switch {
  position: relative;
  width: 44px;
  height: 24px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: background .2s;
  flex-shrink: 0;
}
.switch::after {
  content: '';
  position: absolute;
  top: 1px;
  left: 1px;
  width: 20px;
  height: 20px;
  background: var(--card);
  border-radius: 50%;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
  transition: transform .2s;
}
.switch.on {
  background: var(--green);
}
.switch.on::after {
  transform: translateX(20px);
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 200;
  padding: 12px;
}
.modal {
  background: var(--card);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 600px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 18px;
  animation: slideUp .25s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal h2 {
  margin: 0 0 12px;
  font-size: 17px;
  color: var(--navy);
}
.alt-option {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.alt-option:hover {
  border-color: var(--accent);
  background: var(--bg-2);
}
.alt-option.selected {
  border-color: var(--green);
  background: rgba(30,136,63,.08);
}
.alt-option .pct {
  font-size: 11px;
  color: var(--fg-3);
  margin-top: 2px;
}

/* Tracker */
.tracker-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.tracker-row:last-child { border: 0; }
.tracker-row .label {
  font-size: 14px;
  font-weight: 500;
}
.tracker-row input[type="number"] {
  width: 80px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  text-align: right;
}
.tracker-row textarea {
  width: 100%;
  min-height: 60px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
}
.water-row {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 4px;
  margin-top: 6px;
}
.water-glass {
  height: 32px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.water-glass.filled {
  background: var(--accent);
}
.meal-check {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  background: var(--bg-2);
  border-radius: 8px;
  margin-bottom: 6px;
  cursor: pointer;
}
.meal-check.done {
  background: rgba(30,136,63,.1);
  border: 1px solid var(--green);
}
.meal-check-checkbox {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  cursor: pointer;
  accent-color: var(--green);
}
.meal-check-name {
  flex: 1;
  font-size: 14px;
}
.meal-check.done .meal-check-name {
  text-decoration: line-through;
  color: var(--fg-3);
}

.macro-summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.macro-card {
  background: var(--bg-2);
  border-radius: 8px;
  padding: 10px 6px;
  text-align: center;
  border: 1px solid var(--border);
}
.macro-card .value {
  font-size: 18px;
  font-weight: 700;
  display: block;
}
.macro-card .label {
  font-size: 10px;
  color: var(--fg-3);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.macro-card.cal .value { color: var(--orange); }
.macro-card.c .value { color: var(--accent); }
.macro-card.p .value { color: var(--green); }
.macro-card.f .value { color: var(--fg-2); }

.recipe {
  background: var(--bg-2);
  border-radius: 8px;
  padding: 12px;
  margin-top: 8px;
}
.recipe h4 {
  margin: 0 0 6px;
  font-size: 13px;
  color: var(--navy);
}
.recipe ol {
  margin: 0;
  padding-left: 20px;
  font-size: 13px;
  line-height: 1.5;
}

.expand-btn {
  background: none;
  border: 1px dashed var(--border);
  color: var(--accent);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  margin-top: 6px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--fg-3);
}
.empty-state .icon { font-size: 48px; }

@keyframes invFlash { 0% { background: rgba(255,200,100,.35); } 100% { background: transparent; } }
.inventory-row.flash { animation: invFlash 1.6s ease-out; }
.inventory-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 8px;
  background: var(--bg-2);
  border-radius: 6px;
  margin-bottom: 4px;
}
.inventory-row input {
  width: 90px;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--fg);
  font-size: 13px;
  text-align: right;
}

/* Wider screens (Z Fold inner / tablet) */
@media (min-width: 720px) {
  .container { padding: 16px; }
  body { font-size: 16px; }
  .day-pills { gap: 6px; }
  .day-pill { padding: 10px 6px; font-size: 13px; }
  .day-pill .day-letter { font-size: 15px; }
  .macro-summary { grid-template-columns: repeat(4, 1fr); }
  .week-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
}

.notice {
  padding: 12px 14px;
  background: rgba(46,117,182,.1);
  border-left: 4px solid var(--accent);
  border-radius: 6px;
  font-size: 13px;
  color: var(--fg-2);
  margin-bottom: 12px;
}
.notice.warning {
  background: rgba(214,137,16,.1);
  border-left-color: var(--orange);
}
.notice.success {
  background: rgba(30,136,63,.1);
  border-left-color: var(--green);
}

h2.section {
  margin: 4px 0 12px;
  font-size: 18px;
  color: var(--navy);
}

.subtle { color: var(--fg-3); font-size: 12px; }
.right { text-align: right; }
.center { text-align: center; }
.spacer { height: 12px; }
.hidden { display: none !important; }

/* Stores */
.store-select {
  font-size: 11px;
  padding: 4px 6px;

  cheese_15: 15, cheese_10_12: 11, cheese_5: 5,
};
// Reference grams (for display in settings only)

  cheese_40_45: 30, cheese_20_22: 50, cheese_17_18: 70,
  cheese_15: 80, cheese_10_12: 100, cheese_5: 200,
};
const CHEESE_ORDER = ['cheese_40_45','cheese_20_22','cheese_17_18','cheese_15','cheese_10_12','cheese_5'];

// Adjust cheese grams when substituting across fat categories — ADDITIVE FORMULA:
// new_qty = orig_qty + (fat%_orig − fat%_chosen)
function cheeseScaledGrams(origId, resolvedId, origGrams) {
  const o = getIngredient(origId), r = getIngredient(resolvedId);
  if (!o || !r || o.cat !== 'cheese' || r.cat !== 'cheese') return origGrams;
  const fatO = CHEESE_FAT[o.group], fatR = CHEESE_FAT[r.group];
  if (fatO == null || fatR == null) return origGrams;
  const result = origGrams + (fatO - fatR);
  return Math.max(5, Math.round(result)); // guard against ≤0
}

// Get original grams of a meal item (for scaling display in modal)
function getMealItemGrams(mealId, ingredientId, dateISO) {
  const dObj = new Date(dateISO + 'T00:00:00');
  const dayIdx = (dObj.getDay() + 6) % 7;
  const menu = MENUS[WEEK_ORDER[dayIdx]];
  if (!menu || !menu[mealId]) return 0;
  const item = menu[mealId].items.find(it => it.ing === ingredientId);
  return item ? item.g : 0;
}

function T(key, ...path) {
  let v = I18N[state.lang || 'el'][key];
  if (v === undefined) v = I18N.el[key];
  for (const p of path) {
    if (v && typeof v === 'object') v = v[p];
  }
  return v !== undefined ? v : key;
}


// Shopping-list ingredient name — strips cooking modifiers
function shopIngName(ing) {
  let n = ingName(ing);
  if (!n) return '';
  // Strip Greek cooking words
  n = n
    .replace(/\s*βρασμέν[αηοες]+\s*/g, ' ')
    .replace(/\s*βραστ[άήά]\s*/g, ' ')
    .replace(/\s*μαγειρεμέν[αηοες]+\s*/g, ' ')
    .replace(/\s*ψητ[όήάέ]\s*/g, ' ')
    .replace(/\s*\(βραστ[άή]\)\s*/g, ' ');
  // Strip English cooking modifiers in parentheses
  n = n
    .replace(/\s*\(cooked\)\s*/gi, ' ')
    .replace(/\s*\(boiled\)\s*/gi, ' ')
    .replace(/\s*\(grilled\)\s*/gi, ' ');
  // Strip leading "Grilled " and capitalize first letter
  n = n.replace(/^Grilled\s+/i, '');
  n = n.trim().replace(/\s+/g, ' ');
  if (n.length > 0) n = n[0].toUpperCase() + n.slice(1);
  return n;
}

function ingName(ing) {
  if (!ing) return '';
  return state.lang === 'en' && ing.name_en ? ing.name_en : ing.name;
}

function mealName(meal) {
  if (!meal) return '';
  return state.lang === 'en' && meal.nameEn ? meal.nameEn : meal.name;
}

// Format the unit string: ALWAYS uses English unit terminology (tbsp/tsp/cup/ml/g/pcs).
// Descriptive Greek words (βρασμένα, ψητό κλπ) translated only when state.lang === 'en'.
function fmtUnit(s) {
  if (!s) return '';
  const lang = state.lang || 'el';

  // N/M fraction (like 3/4) φλ. τσαγιού — handle before decimal fallback
  s = s.replace(/(\d+)\/(\d+)\s*φλ\.?\s*τσαγιο[ύυ]/g, (m, num, den) => {
    const count = parseInt(num,10) / parseInt(den,10);
    const ml = Math.round(count * 200);
    const cup = (ml / 240).toFixed(2);
    return ml + ' ml (' + cup + ' cup)';
  });
  // φλ. τσαγιού → ml + cup (English unit terminology always)
  s = s.replace(/(\d*[½⅓¼¾⅔]|\d+(?:[\.,]\d+)?)\s*φλ\.?\s*τσαγιο[ύυ]/g, (m, n) => {
    const count = parseFloat(n.replace('½','.5').replace('⅓','.33').replace('¼','.25').replace('¾','.75').replace('⅔','.67').replace(',','.'));
    const ml = Math.round(count * 200);
    const cup = (ml / 240).toFixed(2);
    return ml + ' ml (' + cup + ' cup)';
  });

  // κεσεδάκι → grams + cup (1 κεσεδάκι ≈ 200g/ml)
  s = s.replace(/(\d*[½⅓¼]|\d+(?:[\.,]\d+)?)\s*κεσεδάκι/g, (m, n) => {
    const count = parseFloat(n.replace('½','.5').replace('⅓','.33').replace('¼','.25').replace(',','.'));
    const g = Math.round(count * 200);
    const cup = (g / 240).toFixed(2);
    return n + ' κεσεδάκι (' + g + ' g · ' + cup + ' cup)';
  });

  // κ.σ. → tbsp (+ml)
  s = s.replace(/(\d*[½⅓¼]|\d+(?:[\.,]\d+)?)\s*κ\.?\s*σ\.?/g, (m, n) => {
    const count = parseFloat(n.replace('½','.5').replace('⅓','.33').replace('¼','.25').replace(',','.'));
    const ml = Math.round(count * 15);
    return n + ' tbsp (' + ml + ' ml)';
  });

  // κ.γ. → tsp (+ml)
  s = s.replace(/(\d*[½⅓¼]|\d+(?:[\.,]\d+)?)\s*κ\.?\s*γ\.?/g, (m, n) => {
    const count = parseFloat(n.replace('½','.5').replace('⅓','.33').replace('¼','.25').replace(',','.'));
    const ml = Math.round(count * 5);
    return n + ' tsp (' + ml + ' ml)';
  });

  // Unit nouns — ALWAYS English (per user request)
  // Note: \b doesn't work for Greek chars in JS, use Unicode lookarounds
  s = s
    .replace(/γρ(?![α-ωΑ-Ωάέήίόύώϊϋΐΰ0-9])/g, 'g')
    .replace(/(^|[\s\d.])τεμ\.?/g, '$1pcs')
    .replace(/φέτες τοστ/g, 'toast slices')
    .replace(/φέτα τοστ/g, 'toast slice')
    .replace(/φακελάκι/g, 'sachet')
    .replace(/κεσεδάκι/g, 'tub')
    .replace(/ποτήρι/g, 'glass')
    .replace(/μπολ/g, 'bowl')
    .replace(/ψεκασμοί/g, 'sprays')
    .replace(/ψεκασμός/g, 'spray');

  // Descriptive words — only in English mode
  if (lang === 'en') {
    s = s
      .replace(/μεγάλο/g, 'large')
      .replace(/βρασμένα|βρασμένη|βρασμένο/g, 'cooked')
      .replace(/μαγειρεμένα|μαγειρεμένη|μαγειρεμένο/g, 'cooked')
      .replace(/ψητό|ψητή|ψητά/g, 'grilled')
      .replace(/μισά καρύδια/g, 'walnut halves')
      .replace(/ντοματίνια/g, 'cherry tomatoes')
      .replace(/μυρωδικά/g, 'herbs')
      .replace(/πιπεριές/g, 'peppers')
      .replace(/μανιτάρια/g, 'mushrooms')
      .replace(/αγγούρι/g, 'cucumber')
      .replace(/λίγο|λίγες|λίγη/g, 'a bit')
      .replace(/σαλάτα εποχής/g, 'seasonal salad')
      .replace(/σαλάτα/g, 'salad')
      .replace(/βραστά λαχανικά/g, 'boiled vegetables')
      .replace(/μαρούλι/g, 'lettuce')
      .replace(/καλαμάκια/g, 'skewers')
      .replace(/ασπράδια/g, 'egg whites')
      .replace(/φρούτο/g, 'fruit');
  }
  return s;
}

// ΣΥΓΧΩΝΕΥΣΗ ΤΟΠΙΚΩΝ ↔ CLOUD
// Πριν: όποια συσκευή έγραφε τελευταία, έσβηνε τα δεδομένα της άλλης.
// Τώρα: ενώνονται. Καμία καταχώρηση δεν χάνεται, από καμία συσκευή.
// ============================================================================

// Πόσο «γεμάτη» είναι μια ημερήσια εγγραφή — για να ξέρουμε ποια υπερισχύει
// όταν το ίδιο πεδίο έχει διαφορετική τιμή στις δύο πλευρές.
function _entryRichness(e) {
  if (!e) return -1;
  let r = 0;
  if (e.meals) for (const k of Object.keys(e.meals)) if (e.meals[k]) r++;
  if (e.mealAtTime) r += Object.keys(e.mealAtTime).length;
  if (e.water) r++;
  if (e.weight != null) r++;
  if (e.notes) r++;
  if (e.tea) r++;
  if (e.subs) r += Object.keys(e.subs).length;
  return r;
}

// Ένωση δύο εγγραφών της ίδιας ημέρας.
function _mergeDayEntry(a, b) {
  if (!a) return b;
  if (!b) return a;
  const primary = _entryRichness(a) >= _entryRichness(b) ? a : b;
  const other = (primary === a) ? b : a;
  const out = Object.assign({}, other, primary);

  // Αντικείμενα: ένωση κλειδιών, με προτεραιότητα στην πληρέστερη πλευρά
  for (const key of ['mealAtTime', 'subs', 'textSubs']) {
    if (a[key] || b[key]) out[key] = Object.assign({}, other[key] || {}, primary[key] || {});
  }
  // Τσεκαρισμένα γεύματα: ένα «ναι» από οποιαδήποτε συσκευή αρκεί
  if (a.meals || b.meals) {
    out.meals = {};
    for (const k of new Set([].concat(Object.keys(a.meals || {}), Object.keys(b.meals || {})))) {
      out.meals[k] = !!((a.meals && a.meals[k]) || (b.meals && b.meals[k]));
    }
  }
  // Οι αφαιρέσεις αποθέματος ΔΕΝ ενώνονται — θα διπλομετρούσαν
  out.deducted = primary.deducted || other.deducted;

  out.water = Math.max(a.water || 0, b.water || 0);
  out.weight = (primary.weight != null) ? primary.weight : (other.weight != null ? other.weight : null);
  out.notes = primary.notes || other.notes || '';
  out.tea = !!(a.tea || b.tea);
  if (Array.isArray(primary.mealOrder) || Array.isArray(other.mealOrder)) {
    out.mealOrder = primary.mealOrder || other.mealOrder;
  }
  return out;
}

function _uniqBy(arr, keyFn) {
  const seen = new Set(), out = [];
  for (const x of arr) {
    const k = keyFn(x);
    if (!seen.has(k)) { seen.add(k); out.push(x); }
  }
  return out;
}

// Επιστρέφει {state, stats}. Βάση το cloud, προστίθεται ό,τι έχει μόνο το τοπικό.
function _mergeStates(local, cloud) {
  const stats = { addedDays: 0, mergedDays: 0, addedProfiles: 0, addedPurchases: 0 };
  if (!cloud) return { state: local, stats };
  if (!local) return { state: cloud, stats };
  const out = JSON.parse(JSON.stringify(cloud));
  out.profiles = out.profiles || {};

  for (const pid of Object.keys(local.profiles || {})) {
    const lp = local.profiles[pid];
    if (!out.profiles[pid]) {
      out.profiles[pid] = JSON.parse(JSON.stringify(lp));
      stats.addedProfiles++;
      continue;
    }
    const cp = out.profiles[pid];
    cp.log = cp.log || {};
    const ll = lp.log || {};
    for (const d of Object.keys(ll)) {
      if (!cp.log[d]) {
        cp.log[d] = JSON.parse(JSON.stringify(ll[d]));
        stats.addedDays++;
      } else {
        const before = JSON.stringify(cp.log[d]);
        cp.log[d] = _mergeDayEntry(ll[d], cp.log[d]);
        if (JSON.stringify(cp.log[d]) !== before) stats.mergedDays++;
      }
    }
    // Ρυθμίσεις: ένωση· τα κλειδιά που υπάρχουν μόνο τοπικά διατηρούνται
    for (const key of ['filters', 'menuSubs']) {
      cp[key] = Object.assign({}, lp[key] || {}, cp[key] || {});
    }
    if (!cp.plans || cp.plans.length === 0) cp.plans = lp.plans || [];
    if (!cp.activePlanId) cp.activePlanId = lp.activePlanId || null;
    if (!cp.dietStartDate) cp.dietStartDate = lp.dietStartDate || null;
    if (!cp.name && lp.name) cp.name = lp.name;
    // Σημαίες migration: ό,τι έχει τρέξει τοπικά δεν ξανατρέχει
    for (const k of Object.keys(lp)) {
      if (k.charAt(0) === '_' && cp[k] === undefined) cp[k] = lp[k];
    }
  }

  // Καθολικά αντικείμενα
  for (const key of ['inventory', 'packs', 'itemStores']) {
    out[key] = Object.assign({}, local[key] || {}, out[key] || {});
  }
  // Αγορές: ένωση χωρίς διπλοεγγραφές
  const beforeP = (out.purchases || []).length;
  out.purchases = _uniqBy([].concat(out.purchases || [], local.purchases || []),
                          p => JSON.stringify([p && p.date, p && p.id, p && p.grams, p && p.price]));
  stats.addedPurchases = out.purchases.length - beforeP;
  // Προσαρμοσμένες λίστες
  out.customIngredients = _uniqBy([].concat(out.customIngredients || [], local.customIngredients || []),
                                  x => x && x.id);
  out.customStores = _uniqBy([].concat(out.customStores || [], local.customStores || []),
                             x => x && x.id);
  return { state: out, stats };
}

  if (!_cloudHealthy) { console.warn('push ακυρώθηκε — ο συγχρονισμός δεν είναι υγιής'); return; }
  if (typeof snapshotActiveProfile === 'function') snapshotActiveProfile();
  if (!_hasMeaningfulData(state)) return; // never push empty/factory state
  _cloudWriteId = _newWriteId();
  const payload = JSON.parse(JSON.stringify(state));
  try { await window.fbSetDoc(_cloudDocRef, {state: payload, lastWrite: _cloudWriteId, ts: Date.now()}); _cloudError = null; }
  catch(e) {
    _cloudHealthy = false;
    _cloudError = (e && (e.code || e.message)) ? String(e.code || e.message) : 'unknown';
    console.error('cloud sync push failed:', e);
    if (typeof renderProfileBar === 'function') renderProfileBar();
  }
}
async function setupCloudSync(user) {
  if (_cloudSyncSetUp) return;
  _cloudSyncSetUp = true;
  _cloudDocRef = window.fbDocRef('households/' + user.uid);
  let initialDone = false;
  try {
    const snap = await window.fbGetDoc(_cloudDocRef);
    const cloudState = snap.exists() && snap.data() && snap.data().state ? snap.data().state : null;
    const cloudHas = _hasMeaningfulData(cloudState);
    const localHas = _hasMeaningfulData(state);
    _cloudHealthy = true;   // η ανάγνωση πέτυχε — από εδώ και πέρα το push είναι ασφαλές
    _cloudError = null;
    if (cloudHas && localHas) {
      // Και οι δύο πλευρές έχουν δεδομένα — τα ενώνουμε αντί να διαλέξουμε μία.
      const m = _mergeStates(state, cloudState);
      _applyCloudState(m.state);
      if (typeof applyActivePlan === 'function') applyActivePlan();
      if (_mergeChanged(m.stats)) {
        console.log('συγχώνευση με cloud:', JSON.stringify(m.stats));
        _lastMergeStats = m.stats;
        await _pushStateToCloud();   // το cloud δεν είχε όλα — του τα στέλνουμε
      }
    } else if (cloudHas) {
      _applyCloudState(cloudState);
      if (typeof applyActivePlan === 'function') applyActivePlan();
    } else if (localHas) {
      await _pushStateToCloud();
    }
    // both empty → wait for real data before syncing
  } catch(e) {
    _cloudHealthy = false;
    _cloudError = (e && (e.code || e.message)) ? String(e.code || e.message) : 'unknown';
    console.error('cloud sync initial failed:', e);
  }
  initialDone = true;
  if (typeof render === 'function') render();
  if (typeof renderProfileBar === 'function') renderProfileBar();
  // real-time listener for updates from other devices
  _cloudUnsub = window.fbOnSnapshot(_cloudDocRef, (snap) => {
    if (!initialDone) return;
    if (!snap.exists()) return;
    const d = snap.data();
    if (!d || !d.state) return;
    if (d.lastWrite === _cloudWriteId) return; // ignore own write echo
    // Αλλαγή από άλλη συσκευή: ενώνουμε, δεν αντικαθιστούμε — αλλιώς θα
    // χάνονταν ό,τι καταχωρήθηκε εδώ στο ενδιάμεσο.
    const m = _mergeStates(state, d.state);
    _applyCloudState(m.state);
    if (_mergeChanged(m.stats)) {
      console.log('συγχώνευση από άλλη συσκευή:', JSON.stringify(m.stats));
      _lastMergeStats = m.stats;
      _pushStateToCloud();   // συγκλίνει: μόλις οι δύο πλευρές ταυτιστούν, σταματά
    }
    if (typeof applyActivePlan === 'function') applyActivePlan();
    if (typeof render === 'function') render();
    if (typeof renderProfileBar === 'function') renderProfileBar();
  });
  // wrap saveState to also push to cloud (debounced)
  if (!_origSaveState) {
    _origSaveState = window.saveState;
    window.saveState = function() {
      _origSaveState.apply(this, arguments);
      if (_cloudWriteTimer) clearTimeout(_cloudWriteTimer);
      _cloudWriteTimer = setTimeout(_pushStateToCloud, 700);
    };
  }
}
function cloudStatus() {
  if (!authEnabled()) return {kind:'local',  label: T('syncLocalMode')};
  if (!window.fbUser)  return {kind:'off',    label: T('syncSignedOut')};
  if (!_cloudHealthy)  return {kind:'error',  label: T('syncError') + (_cloudError ? ' (' + _cloudError + ')' : '')};
  return {kind:'ok', label: window.fbUser.email || T('cloudConnected')};
}
function teardownCloudSync() {
  _cloudHealthy = false; _cloudError = null;
  if (_cloudUnsub) try { _cloudUnsub(); } catch(e){}
  _cloudUnsub = null;
  _cloudDocRef = null;
  _cloudSyncSetUp = false;
}

function handleImportDataFile(input) {

    try { JSON.parse(txt); } catch(err) { alert('Μη έγκυρο αρχείο.'); return; }
    if (!confirm(T('importConfirm'))) return;
    localStorage.setItem('omioastasis_state', txt);

// Auth state change callback (called from the Firebase module script)
window.onFirebaseAuthChanged = function(user) {
  if (!authEnabled()) {
    // Local file / non-https — Firebase Auth doesn't work; run in offline/local mode.
    closeModal();
    if (typeof renderProfileBar === 'function') renderProfileBar();
    if (typeof render === 'function') render();

function getEffectiveStoreId(ingredientId) {
  const explicit = state.itemStores && state.itemStores[ingredientId];
  if (explicit) return explicit;
  const ing = getIngredient(ingredientId);
  if (ing && ing.cat === 'imon') return 'imon';
  return null;
}

  return !!(state.itemStores && state.itemStores[ingredientId]);

// Most-used store (auto-detected) — used when no explicit favorite is set
function getMostUsedStore() {
  const counts = {};
  for (const sid of Object.values(state.itemStores || {})) {
    if (sid) counts[sid] = (counts[sid] || 0) + 1;
  }
  let best = null, bestCount = 0;
  for (const [sid, c] of Object.entries(counts)) {
    if (c > bestCount) { best = sid; bestCount = c; }
  }
  return best;
}

function getFavoriteStore() {
  return state.favoriteStore || getMostUsedStore();
}

function setItemStore(ingredientId, storeId) {
  if (!state.itemStores) state.itemStores = {};
  if (storeId) {
    state.itemStores[ingredientId] = storeId;
  } else {
    delete state.itemStores[ingredientId];
  }
  saveState();
  render();
}

function setFavoriteStore(storeId) {

  saveState();
  render();
}

function addCustomStore() {
  const name = prompt(T('addStorePrompt'));
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  // Generate ID from name
  const id = 'custom_' + Date.now();
  if (!state.customStores) state.customStores = [];
  state.customStores.push({id, name: trimmed});
  saveState();
  render();
}

function deleteCustomStore(id) {
  if (!confirm(T('confirmDeleteStore'))) return;
  state.customStores = (state.customStores || []).filter(s => s.id !== id);
  // Unassign any items pointing to this store
  for (const [iid, sid] of Object.entries(state.itemStores || {})) {
    if (sid === id) delete state.itemStores[iid];
  }
  // Clear favorite if pointed here
  if (state.favoriteStore === id) state.favoriteStore = null;
  saveState();
  render();
}

// ============================================================================
function getDietStart() {
  if (state.dietStartDate) {
    const d = new Date(state.dietStartDate + 'T00:00:00');
    if (!isNaN(d)) return d;
  }
  // Default: most recent Monday on/before today
  const d = new Date();
  d.setHours(0,0,0,0);
  const dayOfWeek = (d.getDay() + 6) % 7; // 0=Mon..6=Sun
  d.setDate(d.getDate() - dayOfWeek);
  return d;
}

function dietDayDate(dayIdx) {
  const start = getDietStart();
  // dayIdx 0..6 in the current week pill row, but we anchor to start of diet
  // Here dayIdx is "day of current selected week" → calendar day
  const d = new Date(start);
  // We need to map: dayIdx 0=Mon..6=Sun of the SAME week as today
  // Actually keep semantics: dayIdx is position in current week (Mon-Sun)
  const todayObj = new Date();
  todayObj.setHours(0,0,0,0);
  const todayIdx = (todayObj.getDay() + 6) % 7;
  const diff = dayIdx - todayIdx;
  const result = new Date(todayObj);
  result.setDate(result.getDate() + diff);
  return result;
}

function fmtDate(dateObj, short) {
  if (!dateObj) return '';
  const day = String(dateObj.getDate()).padStart(2,'0');
  const month = String(dateObj.getMonth()+1).padStart(2,'0');
  const year = dateObj.getFullYear();
  if (short) return day + '/' + month;
  return day + '/' + month + '/' + year;
}

function dietDayNumber(dateObj) {
  // Returns N where N=1 is start, N=21 is last day (or null if outside 21-day window)
  const start = getDietStart();
  const diff = Math.round((dateObj.getTime() - start.getTime()) / (1000*60*60*24));
  if (diff < 0) return null; // before start
  return diff + 1;
}

function setDietStartDate(iso) {
  state.dietStartDate = iso || null;
  saveState();
  render();
}

// Migrate old format: state.inventory[id] = number  →  {grams: number}
function migrateInventory() {
  if (!state.inventory) state.inventory = {};
  for (const id of Object.keys(state.inventory)) {
    const v = state.inventory[id];
    if (typeof v === 'number') {
      state.inventory[id] = {grams: v};
    }
  }
  // Migrate old 'ospria' → 'ospria_fakes'
  if (state.inventory['ospria'] && !state.inventory['ospria_fakes']) {
    state.inventory['ospria_fakes'] = state.inventory['ospria'];
    delete state.inventory['ospria'];
  }
  if (state.purchases) {
    state.purchases.forEach(p => { if (p.id === 'ospria') p.id = 'ospria_fakes'; });
  }
  // Migrate filter
  if (state.filters && state.filters['ospria'] && !state.filters['ospria_fakes']) {
    state.filters['ospria_fakes'] = state.filters['ospria'];
    delete state.filters['ospria'];
  }
  // Migrate itemStores
  if (state.itemStores && state.itemStores['ospria']) {
    state.itemStores['ospria_fakes'] = state.itemStores['ospria'];
    delete state.itemStores['ospria'];
  }
  // Migrate 'fish' → 'fish_lavraki'
  if (state.inventory && state.inventory['fish'] && !state.inventory['fish_lavraki']) {
    state.inventory['fish_lavraki'] = state.inventory['fish'];
    delete state.inventory['fish'];
  }
  if (state.purchases) state.purchases.forEach(p => { if (p.id === 'fish') p.id = 'fish_lavraki'; });
  if (state.filters && state.filters['fish'] && !state.filters['fish_lavraki']) {
    state.filters['fish_lavraki'] = state.filters['fish'];
    delete state.filters['fish'];
  }
  if (state.itemStores && state.itemStores['fish']) {
    state.itemStores['fish_lavraki'] = state.itemStores['fish'];
    delete state.itemStores['fish'];
  }
}

function getInvGrams(id) {
  const inv = state.inventory && state.inventory[id];
  if (!inv) return 0;
  if (typeof inv === 'number') return inv;
  return inv.grams || 0;
}

function setInvGrams(id, grams) {
  if (!state.inventory[id]) state.inventory[id] = {};
  if (typeof state.inventory[id] === 'number') state.inventory[id] = {grams: state.inventory[id]};
  state.inventory[id].grams = Math.max(0, grams);
  saveState();
}

function getInvPricePerGram(id) {
  // Return latest purchase pricePerGram, computed from purchases log
  const ps = (state.purchases || []).filter(p => p.id === id);
  if (ps.length === 0) return 0;
  const latest = ps[ps.length - 1];
  return latest.grams > 0 ? (latest.price / latest.grams) : 0;
}

function getInvUnit(id) {
  // Return latest unit info from purchases
  const ps = (state.purchases || []).filter(p => p.id === id);
  if (ps.length === 0) return null;
  return ps[ps.length - 1].unit || null;
}

// Total grams needed per week (from 7-day menu plan, respecting filters/disabled)
function getWeeklyNeed(ingredientId) {
  let total = 0;
  for (let d = 0; d < 7; d++) {
    const menu = MENUS[WEEK_ORDER[d]];
    if (!menu) continue;
    for (const mt of MEAL_TYPES) {
      const meal = menu[mt.id];
      if (!meal) continue;
      for (const item of meal.items) {
        const target = resolveIngredient(item.ing);
        if (!target || !isEnabled(target.id)) continue;
        if (target.id === ingredientId) total += item.g;
      }
    }
  }
  return total;
}

// Low stock: tracked AND current < 30% of weekly need (but > 0)
function isLowStock(ingredientId) {
  if (isOutOfStock(ingredientId)) return false; // already 0 → out, not "low"
  const grams = getInvGrams(ingredientId);
  if (grams === 0) return false; // not tracked
  // Must have been touched (purchases or explicit)
  const tracked = (state.purchases || []).some(p => p.id === ingredientId)
    || (state.inventory && state.inventory[ingredientId]);
  if (!tracked) return false;
  const need = getWeeklyNeed(ingredientId);
  if (need <= 0) return false;
  return grams < (need * 0.30);
}

function countLowStock() {
  let n = 0;
  for (const ing of INGREDIENTS) {
    if (isLowStock(ing.id)) n++;
  }
  return n;
}

function countOutOfStock() {
  let n = 0;
  for (const ing of INGREDIENTS) {
    if (isOutOfStock(ing.id)) n++;
  }
  return n;
}

// ===== VARIETY ROTATION =====
// For future days only, if ingredient has group with multiple enabled members,
// suggest a member NOT recently used (in past 3 days). Respects daily overrides.
const ROTATABLE_GROUPS = ['fruit_season','legume_group','nuts_group','ladera_group','starch_lunch'];
// Effective AUTO resolution for a slot (no manual sub): filter substitute + variety rotation
function effectiveAutoIngredient(origIngId, mealId, dateISO) {
  const orig = getIngredient(origIngId);
  if (!orig) return null;
  const f = state.filters[origIngId];
  const filtered = f && f.enabled === false;
  if (filtered) {
    if (f.altId && isEnabled(f.altId) && getIngredient(f.altId)) return getIngredient(f.altId);
    return resolveIngredient(origIngId) || orig;
  }
  if (mealId && dateISO) {
    const dateDay = new Date(dateISO + 'T00:00:00');
    const todayDay = new Date(); todayDay.setHours(0,0,0,0);
    const todayDayIdx = (todayDay.getDay() + 6) % 7;
    const dateDayIdx = (dateDay.getDay() + 6) % 7;
    if (dateDay > todayDay) {
      const rid = getVarietyRotation(origIngId, dateDayIdx, todayDayIdx);
      if (rid && getIngredient(rid)) return getIngredient(rid);
    }
  }
  return orig;
}

function getVarietyRotation(originalId, dayIdx, todayIdx) {
  // Only for future days (not today, not past)
  if (dayIdx <= todayIdx) return null;
  const orig = getIngredient(originalId);
  if (!orig || !orig.group) return null;
  // Only rotate "free choice" categories (not bread/cheese/flakes where diet is specific)
  if (!ROTATABLE_GROUPS.includes(orig.group)) return null;
  const members = INGREDIENTS.filter(i => i.group === orig.group && isEnabled(i.id));
  if (members.length <= 1) return null;

  // Tally usage in past 3 days (today + 2 days back)
  const usage = {};
  for (const m of members) usage[m.id] = 0;

  for (let offset = 0; offset <= 2; offset++) {
    const di = todayIdx - offset;
    if (di < 0) continue;
    const date = dietDayDate(di).toISOString().slice(0,10);
    const menu = MENUS[WEEK_ORDER[di]];
    if (!menu) continue;
    for (const mt of MEAL_TYPES) {
      const meal = menu[mt.id];
      if (!meal) continue;
      for (const item of meal.items) {
        // Check daily override
        const daySub = getDailySubstitute(date, mt.id, item.ing);
        const resolvedId = daySub || resolveIngredient(item.ing).id;
        if (usage[resolvedId] !== undefined) usage[resolvedId]++;
      }
    }
  }

  // Pick the member with lowest usage; prefer one different from original
  let best = null, bestUsage = Infinity;
  for (const m of members) {
    const u = usage[m.id];
    if (u < bestUsage) { bestUsage = u; best = m.id; }
  }
  // If best is same as original AND original has been used, try next
  if (best === originalId && members.length > 1) {
    let nextBest = null, nb = Infinity;
    for (const m of members) {
      if (m.id === originalId) continue;
      if (usage[m.id] < nb) { nb = usage[m.id]; nextBest = m.id; }
    }
    if (nextBest && nb <= usage[originalId]) best = nextBest;
  }
  if (best && best !== originalId) return best;
  return null;
}

// Returns true if the ingredient is explicitly tracked AND stock has been depleted
function isOutOfStock(id) {
  if (!state.inventory) return false;
  const inv = state.inventory[id];
  if (inv === undefined || inv === null) return false;
  if (typeof inv === 'number') return inv === 0;
  // Object form: only flag as out-of-stock if user has touched it AND grams=0
  if (!inv.grams && !((state.purchases || []).some(p => p.id === id))) return false;
  return (inv.grams || 0) === 0;
}


function addPurchase(id, grams, price, unit, dateISO) {
  if (!state.purchases) state.purchases = [];
  const date = dateISO || todayISO();
  state.purchases.push({date, id, grams: +grams || 0, price: +price || 0, unit: unit || ''});
  // Update inventory
  if (!state.inventory[id]) state.inventory[id] = {};
  if (typeof state.inventory[id] === 'number') state.inventory[id] = {grams: state.inventory[id]};
  state.inventory[id].grams = (state.inventory[id].grams || 0) + (+grams || 0);
  saveState();
  closeModal();
  render();
}

function deletePurchase(idx) {
  if (!state.purchases) return;
  if (!confirm(T('confirmDeletePurchase'))) return;
  const p = state.purchases[idx];
  state.purchases.splice(idx, 1);
  // Roll back inventory
  if (p && state.inventory[p.id]) {
    const inv = state.inventory[p.id];
    if (typeof inv === 'number') {
      state.inventory[p.id] = {grams: Math.max(0, inv - (p.grams || 0))};
    } else {
      inv.grams = Math.max(0, (inv.grams || 0) - (p.grams || 0));
    }
  }
  saveState();
  render();
}

// === Statistics helpers ===
function getConsumedGrams(id, opts) {
  // opts: {from: ISO, to: ISO} — filter date range (inclusive)
  let total = 0;
  for (const date of Object.keys(state.log || {})) {
    if (opts && opts.from && date < opts.from) continue;
    if (opts && opts.to && date > opts.to) continue;
    const log = state.log[date];
    if (!log || !log.meals) continue;
    const dayIdx = (new Date(date + 'T00:00:00').getDay() + 6) % 7;
    const menu = MENUS[WEEK_ORDER[dayIdx]];
    if (!menu) continue;
    for (const mtId of Object.keys(log.meals)) {
      if (!log.meals[mtId]) continue;
      const meal = menu[mtId];
      if (!meal) continue;
      for (const item of meal.items) {
        const target = resolveIngredient(item.ing);
        if (!target || target.id !== id) continue;
        total += item.g;
      }
    }
  }
  return total;
}

function getTotalSpent(opts) {
  // Total € spent based on purchases log
  let total = 0;
  for (const p of (state.purchases || [])) {
    if (opts && opts.from && p.date < opts.from) continue;
    if (opts && opts.to && p.date > opts.to) continue;
    total += p.price || 0;
  }
  return total;
}

function getConsumedValue(opts) {
  // € value of consumed items (using current pricePerGram per ingredient)
  let total = 0;
  for (const ing of INGREDIENTS) {
    const ppg = getInvPricePerGram(ing.id);
    if (!ppg) continue;
    const g = getConsumedGrams(ing.id, opts);
    total += g * ppg;
  }
  return total;
}

function getTopConsumed(n, opts) {
  // Returns top N ingredients by consumed grams
  const arr = [];
  for (const ing of INGREDIENTS) {
    const g = getConsumedGrams(ing.id, opts);
    if (g > 0) arr.push({id: ing.id, ing, grams: g, value: g * getInvPricePerGram(ing.id)});
  }
  arr.sort((a, b) => b.grams - a.grams);
  return arr.slice(0, n || 5);
}

function getTopSpent(n, opts) {
  // Returns top N by total € purchased
  const byId = {};
  for (const p of (state.purchases || [])) {
    if (opts && opts.from && p.date < opts.from) continue;
    if (opts && opts.to && p.date > opts.to) continue;
    if (!byId[p.id]) byId[p.id] = 0;
    byId[p.id] += p.price || 0;
  }
  const arr = Object.entries(byId).map(([id, total]) => ({id, ing: getIngredient(id), total}));
  arr.sort((a, b) => b.total - a.total);
  return arr.slice(0, n || 5);
}

// ============================================================================
// MEAL TIME HELPERS
// ============================================================================
function parseTime(s) {
  // 'HH:MM' → minutes since midnight
  if (!s || typeof s !== 'string') return null;
  const m = s.match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  return parseInt(m[1]) * 60 + parseInt(m[2]);
}

function fmtTime(mins) {
  if (mins == null) return '';
  mins = ((mins % (24*60)) + 24*60) % (24*60);
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

// Compute the displayed times for all meals on a given day
// Returns { times: {breakfast: 'HH:MM', ...}, ranges: {morning: [min,max], ...} }
// Takes per-day overrides into account (state.log[dateISO].mealAtTime)

// ===== MEAL ORDER (per-day reordering of middle 4 meals) =====
function getMealOrder(dateISO) {
  const log = state.log[dateISO];
  if (log && Array.isArray(log.mealOrder) && log.mealOrder.length === MEAL_TYPES.length) {
    return log.mealOrder.slice();
  }
  return MEAL_TYPES.map(m => m.id);
}

function moveMeal(dateISO, mealId, dir) {
  // dir: -1 = up, +1 = down. Only middle meals (index 1..length-2) can move,
  // and cannot move into breakfast(0) or bedtime(last) slots.
  let order = getMealOrder(dateISO);
  const idx = order.indexOf(mealId);
  if (idx <= 0 || idx >= order.length - 1) return; // breakfast/bedtime locked
  const newIdx = idx + dir;
  if (newIdx <= 0 || newIdx >= order.length - 1) return; // boundary
  const tmp = order[idx]; order[idx] = order[newIdx]; order[newIdx] = tmp;
  if (!state.log[dateISO]) state.log[dateISO] = {meals:{}, water:0, weight:null, notes:'', tea:false};
  state.log[dateISO].mealOrder = order;
  saveState();
  render();
}

function resetMealOrder(dateISO) {
  if (state.log[dateISO]) delete state.log[dateISO].mealOrder;
  saveState();
  render();
}

// ---- Per-date EXTRA foods added to a meal: state.log[dateISO].extras[mealId] = [{ing,g}] ----
function getMealExtras(dateISO, mealId) {
  const log = state.log[dateISO];
  if (!log || !log.extras || !log.extras[mealId]) return [];
  return log.extras[mealId];
}
function addMealExtra(dateISO, mealId, ingId, grams) {
  const ing = getIngredient(ingId);
  if (!ing) return;
  if (!state.log[dateISO]) state.log[dateISO] = {meals:{}, water:0, weight:null, notes:'', tea:false};
  if (!state.log[dateISO].extras) state.log[dateISO].extras = {};
  if (!state.log[dateISO].extras[mealId]) state.log[dateISO].extras[mealId] = [];
  state.log[dateISO].extras[mealId].push({ing: ingId, g: Math.max(0, Number(grams) || 0)});
  saveState();
  render();
}
function removeMealExtra(dateISO, mealId, idx) {
  const arr = getMealExtras(dateISO, mealId);
  if (idx < 0 || idx >= arr.length) return;
  arr.splice(idx, 1);
  if (arr.length === 0 && state.log[dateISO] && state.log[dateISO].extras) delete state.log[dateISO].extras[mealId];
  saveState();
  render();
}
function extrasMacros(dateISO, mealId) {
  const acc = {cal:0,c:0,p:0,f:0};
  for (const ex of getMealExtras(dateISO, mealId)) {
    const ing = getIngredient(ex.ing);
    if (!ing || !ing.n100 || !isEnabled(ing.id)) continue;
    const g = ex.g || 0;
    acc.cal += ing.n100[0]*g/100; acc.c += ing.n100[1]*g/100; acc.p += ing.n100[2]*g/100; acc.f += ing.n100[3]*g/100;
  }
  return acc;
}
function dayExtrasMacros(dateISO) {
  const acc = {cal:0,c:0,p:0,f:0};
  const log = state.log[dateISO];
  if (!log || !log.extras) return acc;
  for (const mealId of Object.keys(log.extras)) {
    const m = extrasMacros(dateISO, mealId);
    acc.cal+=m.cal; acc.c+=m.c; acc.p+=m.p; acc.f+=m.f;
  }
  return acc;
}
function renderMealExtras(dateISO, mealId) {

  }
  h += '</div>';

}

function computeDayTimes(dateISO) {
  const log = state.log[dateISO] || {};
  const overrides = log.mealAtTime || {};
  const order = getMealOrder(dateISO);
  const times = {};
  const ranges = {};
  let prevMins = null;
  for (let i = 0; i < order.length; i++) {
    const mid = order[i];
    let m;
    if (overrides[mid]) {
      m = parseTime(overrides[mid]);
    } else if (prevMins != null) {
      m = prevMins + Math.round(MEAL_GAP_HOURS * 60);
    } else {
      m = parseTime(DEFAULT_MEAL_TIMES[i]);
    }
    times[mid] = fmtTime(m);
    if (i > 0 && prevMins != null) {
      ranges[mid] = [
        fmtTime(prevMins + Math.round(MEAL_GAP_MIN_HOURS * 60)),
        fmtTime(prevMins + Math.round(MEAL_GAP_MAX_HOURS * 60)),
      ];
    }
    prevMins = m;
  }
  return { times, ranges };
}

function setMealTime(dateISO, mealId, hhmm) {

// Menu+meal substitutions (Meal tab): state.menuSubs[menuKey][mealId][origIngId] = newIngId
// Applies on every day that menu+meal appears (not date-specific).
function getMenuSub(menuKey, mealId, origIngId) {

  if (!m || !m[mealId]) return null;
  const newId = m[mealId][origIngId];
  if (!newId || !getIngredient(newId) || !isEnabled(newId)) return null;

}
function setMenuSub(menuKey, mealId, origIngId, newIngId) {

    // το ξανα-ενεργοποιούμε — αλλιώς το resolveIngredient θα το αντικαθιστούσε αμέσως.
    if (newIngId === origIngId && state.filters && state.filters[origIngId]) {

// Daily ingredient overrides: state.log[dateISO].subs[mealId][origIngId] = newIngId
function getDailySubstitute(dateISO, mealId, origIngId) {
  const log = state.log[dateISO];
  if (!log || !log.subs || !log.subs[mealId]) return null;
  const newId = log.subs[mealId][origIngId];
  if (!newId) return null;
  if (!getIngredient(newId)) return null; // guard: stale id (deleted ingredient)
  if (!isEnabled(newId)) return null;
  return newId;
}

function setDailySubstitute(dateISO, mealId, origIngId, newIngId) {
  if (!state.log[dateISO]) state.log[dateISO] = {meals:{}, water:0, weight:null, notes:'', tea:false};
  if (!state.log[dateISO].subs) state.log[dateISO].subs = {};
  if (!state.log[dateISO].subs[mealId]) state.log[dateISO].subs[mealId] = {};
  if (newIngId && newIngId !== origIngId) {
    state.log[dateISO].subs[mealId][origIngId] = newIngId;
  } else {
    delete state.log[dateISO].subs[mealId][origIngId];
    if (newIngId === origIngId && state.filters && state.filters[origIngId]) {
      state.filters[origIngId].enabled = true;
    }
  }
  // Clear any text sub for this slot
  if (state.log[dateISO].textSubs && state.log[dateISO].textSubs[mealId]) {
    delete state.log[dateISO].textSubs[mealId][origIngId];
  }
  saveState();
  closeModal();
  render();
}

// Text-based daily substitution (for IMON text alternatives)
function getDailyTextSub(dateISO, mealId, origIngId) {

function setDailyTextSub(dateISO, mealId, origIngId, text) {

    }

  closeModal();
  render();

function dateForDay(dayIdx) {
  // Compute the ISO date for the given dayIdx (0=Mon..6=Sun) in the current week
  const now = new Date();
  const todayIdx = (now.getDay() + 6) % 7;
  const diff = dayIdx - todayIdx;
  const d = new Date(now);
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}

function todayISO() {
  return new Date().toISOString().slice(0,10);
}

// ---- Offset-aware week-view helpers (state.weekOffset) ----
// NOTE: do NOT bake offset into dateForDay/dietDayDate (variety rotation uses real week).
function viewWeekOffset() { return state.weekOffset || 0; }
function dateISOForView(dayIdx) {
  const now = new Date();
  const todayIdx = (now.getDay() + 6) % 7;
  const diff = dayIdx - todayIdx + viewWeekOffset() * 7;
  const d = new Date(now);
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}
function dateObjForView(dayIdx) {
  return new Date(dateISOForView(dayIdx) + 'T00:00:00');
}
function weekDatesForOffset(off) {
  const now = new Date();
  const todayIdx = (now.getDay() + 6) % 7;
  const arr = [];
  for (let i = 0; i < 7; i++) {
    const diff = i - todayIdx + (off || 0) * 7;
    const d = new Date(now);
    d.setDate(d.getDate() + diff);
    arr.push(d.toISOString().slice(0,10));
  }
  return arr;
}
function weekNav(delta) { state.weekOffset = viewWeekOffset() + delta; saveState(); render(); }
function weekGoCurrent() { state.weekOffset = 0; saveState(); render(); }
function weekRangeLabel(off) {
  const dates = weekDatesForOffset(off);
  const mon = new Date(dates[0] + 'T00:00:00');
  const sun = new Date(dates[6] + 'T00:00:00');
  return fmtDate(mon, true) + ' \u2013 ' + fmtDate(sun, true);
}
function weekNavBar() {
  const off = viewWeekOffset();
  let label;
  if (off === 0) label = T('weekCurrent');
  else if (off === 1) label = T('weekNext');
  else if (off === -1) label = T('weekPrev');
  else label = (off > 0 ? '+' : '') + off + ' ' + T('weeksOf');
  return `<div class="week-nav">
    <button class="week-nav-btn" onclick="weekNav(-1)">\u25c0</button>
    <div class="week-nav-label">
      <div class="week-nav-title">\ud83d\udcc5 ${label}</div>
      <div class="week-nav-range">${weekRangeLabel(off)}</div>
    </div>
    <button class="week-nav-btn" onclick="weekNav(1)">\u25b6</button>
    ${off !== 0 ? `<button class="btn btn-ghost btn-sm" onclick="weekGoCurrent()">${T('weekToday')}</button>` : ''}
  </div>`;
}

function getIngredient(id) {
  return INGREDIENTS.find(i => i.id === id) || (state.customIngredients || []).find(i => i.id === id);
}
function allIngredients() {
  return INGREDIENTS.concat(state.customIngredients || []);
}

// Check if an ingredient is enabled (i.e. user eats it)
function isEnabled(id) {
  const f = state.filters[id];
  return !f || f.enabled !== false;
}

// Get the substitute ingredient for a given one (if filtered out)
function resolveIngredient(id) {
  const f = state.filters[id];
  if (!f || f.enabled !== false) return getIngredient(id);
  // Filtered out — try chosen altId, but only if it's still enabled & exists
  if (f.altId && isEnabled(f.altId) && getIngredient(f.altId)) {
    return getIngredient(f.altId);
  }
  const orig = getIngredient(id);
  if (!orig) return orig;
  // Explicit global whitelist takes precedence over group logic
  const _gl = globalSubIds(id);
  if (_gl) {
    const allowed = _gl.filter(aid => isEnabled(aid) && getIngredient(aid));
    return allowed.length ? getIngredient(allowed[0]) : orig;
  }
  if (!orig.group) return orig;
  // Same group first
  let candidates = allIngredients().filter(i =>
    i.id !== id && isEnabled(i.id) && ((i.group && i.group === orig.group) || (i.custom && i.cat === orig.cat))
  );
  // CHEESE cross-category fallback: if same fat-category exhausted, pick ANY enabled
  // cheese, preferring the closest fat % (grams will be scaled via the algebraic formula)
  if (candidates.length === 0 && orig.cat === 'cheese') {
    const origFat = (typeof CHEESE_FAT !== 'undefined' && CHEESE_FAT[orig.group]) || 0;
    candidates = allIngredients().filter(i => i.id !== id && i.cat === 'cheese' && isEnabled(i.id));
    candidates.sort((a, b) => {
      const fa = (CHEESE_FAT[a.group] || 0), fb = (CHEESE_FAT[b.group] || 0);
      return Math.abs(fa - origFat) - Math.abs(fb - origFat);
    });
  }
  return candidates[0] || orig;
}

// ---- Explicit substitution rules (dietitian) ----
// Global per-ingredient whitelist: this food may ONLY be replaced by these ids,
// wherever it appears. (Asymmetric — groups can't express this.)
const GLOBAL_SUBS = {
  tomatini:  ['salad_seasonal', 'agouri', 'broccoli'],
  tomato:    ['salad_seasonal', 'agouri', 'broccoli'],
  manitaria: ['salad_seasonal', 'agouri', 'broccoli'],
  chicken:   ['fish_lavraki', 'fish_tsipoura'],
  turkey:    ['fish_lavraki', 'fish_tsipoura'],
};
// Returns array of allowed alt ids for a GLOBAL rule, or null if none.
function globalSubIds(origId) {
  if (origId === 'arabiki_pita' || origId === 'aladoti_pita') {
    // any OTHER item from the Bread & Rusks category
    return INGREDIENTS.filter(i => i.cat === 'bread' && i.id !== origId).map(i => i.id);
  }
  return GLOBAL_SUBS[origId] ? GLOBAL_SUBS[origId].slice() : null;
}
// Explicit allowed alternatives for a slot: per-item .alts override > global rule > null (=use groups).
// Returns array of {id, g} (g = fixed grams override, else null), filtered to enabled & existing.
function altEntriesExplicit(origId, item) {
  if (item && item.alts && item.alts.length) {
    return item.alts
      .map(a => (typeof a === 'string') ? {id: a, g: null} : {id: a.ing, g: (a.g != null ? a.g : null)})
      .filter(e => getIngredient(e.id) && isEnabled(e.id));
  }
  const gl = globalSubIds(origId);
  if (gl) return gl.filter(id => getIngredient(id) && isEnabled(id)).map(id => ({id, g: null}));
  return null;
}
// Effective grams for a resolved ingredient in a slot (per-item alt grams > cheese scaling > item.g).
function effectiveGrams(item, resolvedId) {
  if (!item) return 0;
  if (item.alts && item.alts.length) {
    for (const a of item.alts) {
      const id = (typeof a === 'string') ? a : a.ing;
      if (id === resolvedId && typeof a !== 'string' && a.g != null) return a.g;
    }
  }
  const orig = getIngredient(item.ing), alt = getIngredient(resolvedId);
  if (orig && alt && orig.cat === 'cheese' && alt.cat === 'cheese' && alt.id !== orig.id) {
    return cheeseScaledGrams(orig.id, alt.id, item.g);
  }
  return item.g;
}

// Returns ONLY enabled ingredients allowed as substitutes (explicit global rule first, else same group)
function getAlternatives(id) {
  const orig = getIngredient(id);
  if (!orig) return [];
  const gl = globalSubIds(id);
  if (gl) return gl.filter(aid => isEnabled(aid) && getIngredient(aid)).map(aid => getIngredient(aid));
  return allIngredients().filter(i =>
    i.id !== id && isEnabled(i.id) && ((orig.group && i.group === orig.group) || (i.custom && i.cat === orig.cat))
  );
}

// Calculate macros for a meal item
function macrosForItem(item, mealId, menuKey, dateISO) {
  const orig = getIngredient(item.ing);
  let ing = null;
  if (dateISO && mealId) {
    const ds = getDailySubstitute(dateISO, mealId, item.ing);
    if (ds && getIngredient(ds)) ing = getIngredient(ds);
  }
  if (!ing && menuKey && mealId) {
    const ms = getMenuSub(menuKey, mealId, item.ing);
    if (ms && getIngredient(ms)) ing = getIngredient(ms);
  }
  if (!ing) ing = resolveIngredient(item.ing);
  if (!ing || !ing.n100) return {cal:0, c:0, p:0, f:0};
  // If the resolved ingredient is still disabled (no substitute), zero macros
  if (!isEnabled(ing.id)) return {cal:0, c:0, p:0, f:0};
  let grams = effectiveGrams(item, ing.id);
  const [cal100, c100, p100, f100] = ing.n100;
  return {
    cal: cal100 * grams / 100,
    c: c100 * grams / 100,
    p: p100 * grams / 100,
    f: f100 * grams / 100,
  };
}

function macrosForMeal(meal, mealId, menuKey, dateISO) {
  if (!meal || !meal.items) return {cal:0,c:0,p:0,f:0};
  return meal.items.reduce((acc, item) => {
    const m = macrosForItem(item, mealId, menuKey, dateISO);
    acc.cal += m.cal; acc.c += m.c; acc.p += m.p; acc.f += m.f;
    return acc;
  }, {cal:0,c:0,p:0,f:0});
}

function macrosForDay(dayIdx) {
  const menuKey = WEEK_ORDER[dayIdx];
  const menu = MENUS[menuKey];
  return MEAL_TYPES.reduce((acc, mt) => {
    const m = macrosForMeal(menu[mt.id], mt.id, menuKey);
    acc.cal += m.cal; acc.c += m.c; acc.p += m.p; acc.f += m.f;
    return acc;
  }, {cal:0,c:0,p:0,f:0});
}

function r(num, dp) {
  const d = (dp === undefined || dp === null) ? 0 : dp;
  return num.toFixed(d);
}

function renderItem(item, mealId, dateISO, menuKeyArg) {
  const orig = getIngredient(item.ing);
  if (!orig) return '';
  const f = state.filters[item.ing];
  const filtered = f && f.enabled === false;

  // Check for text-based daily override (IMON alts)
  const textSub = (dateISO && mealId) ? getDailyTextSub(dateISO, mealId, item.ing) : null;

  // Check for single-ingredient daily override
  const dailySubId = (dateISO && mealId) ? getDailySubstitute(dateISO, mealId, item.ing) : null;
  // Menu+meal substitution (Meal-tab swap), applies on all days of this menu
  const menuKey = menuKeyArg || (dateISO ? menuForDate(dateISO).menuKey : null);
  const menuSubId = (!dailySubId && menuKey && mealId) ? getMenuSub(menuKey, mealId, item.ing) : null;

  // Resolve (priority: daily override > menu+meal sub > variety rotation > filter > orig)
  let resolved;
  let varietyApplied = false;
  if (dailySubId) {
    resolved = getIngredient(dailySubId) || orig;
  } else if (menuSubId) {
    resolved = getIngredient(menuSubId) || orig;
  } else if (filtered) {
    resolved = (f.altId && isEnabled(f.altId) && getIngredient(f.altId)) ? getIngredient(f.altId) : (resolveIngredient(item.ing) || orig);
  } else {
    // Try variety rotation for future days
    let rotatedId = null;
    if (mealId && dateISO) {
      // Compute dayIdx from dateISO
      const dateDay = new Date(dateISO + 'T00:00:00');
      const todayDay = new Date();
      todayDay.setHours(0,0,0,0);
      const todayDayIdx = (todayDay.getDay() + 6) % 7;
      const dateDayIdx = (dateDay.getDay() + 6) % 7;
      // Same week (rough check via day-of-week index in selectedDay context)
      if (dateDay > todayDay) {
        rotatedId = getVarietyRotation(item.ing, dateDayIdx, todayDayIdx);
      }
    }
    if (rotatedId) {
      resolved = getIngredient(rotatedId);
      varietyApplied = true;
    } else {
      resolved = orig;
    }
  }

  if (!resolved) resolved = orig; // ultimate safety guard

  const lpAttrs = (mealId && dateISO)
    ? `data-ing="${item.ing}" data-meal="${mealId}" data-date="${dateISO}"`
    : '';

  // If text override is set, show that text instead
  if (textSub) {
    return `<span class="ingredient replacement ingredient-lp" ${lpAttrs}>📝 ${textSub}</span>`;
  }

  // Disabled with no valid substitute (resolves to itself):
  if (filtered && !dailySubId && !menuSubId && resolved.id === orig.id) {
    if (orig.group) {
      // Has a category but ALL options disabled → strikethrough so user can long-press to fix
      return `<span class="ingredient strike ingredient-lp" ${lpAttrs} title="${T('allDisabledTip')}">${ingName(orig)} ${fmtUnit(item.unit)}</span>`;
    }
    return ''; // no group, no possible substitute → hide (deliberately excluded)
  }

  // Compute unit display, with slice count for cheese + cross-category scaling
  let unitStr = item.unit;
  let dispGrams = effectiveGrams(item, resolved.id);
  if (resolved.cat === 'cheese' && dispGrams > 0) {
    // Cheese: ALWAYS show grams only (precise) — regardless of original unit format
    unitStr = dispGrams + ' g';
  }
  // Bread group: convert unit to match the displayed item.
  // Piece-based items (pita) -> pieces; gram-based items (bread/rusks) -> grams.
  if (resolved.cat === 'bread' && dispGrams > 0) {
    if (resolved.pieceG) {
      const np = Math.max(1, Math.round(dispGrams / resolved.pieceG));
      unitStr = np + ' pcs';
    } else {
      unitStr = dispGrams + ' g';
    }
  }
  // Any other substitution to a DIFFERENT ingredient: rebuild the unit from the
  // resolved food — never keep the original's descriptive unit (e.g. "5 ντοματίνια").
  if (resolved.id !== orig.id && resolved.cat !== 'cheese' && resolved.cat !== 'bread' && dispGrams > 0) {
    const _pu = pieceUnitInfo(resolved);
    if (_pu) {
      const _n = Math.max(1, Math.round(dispGrams / _pu.perPiece));
      unitStr = _n + ' ' + _pu.label;
    } else {
      unitStr = fmtAmt(dispGrams, resolved);
    }
  }
  const unit = fmtUnit(unitStr);

  // Stock state
  const oos = isOutOfStock(resolved.id);
  const low = !oos && isLowStock(resolved.id);

  const isReplaced = ((dailySubId && dailySubId !== orig.id) || (menuSubId && menuSubId !== orig.id) || (filtered && resolved.id !== orig.id) || varietyApplied);
  let cls = isReplaced ? 'ingredient replacement ingredient-lp' : 'ingredient ingredient-lp';
  if (oos) cls += ' out-of-stock';
  else if (low) cls += ' low-stock';
  if (varietyApplied) cls += ' variety';
  let icon = '';
  if (oos) icon = '⚠ ';
  else if (low) icon = '⚡ ';
  else if (varietyApplied) icon = '🔄 ';
  let tip = '';
  if (oos) tip = ` title="${T('outOfStockTip')}"`;
  else if (low) tip = ` title="${T('lowStockTip')}"`;
  else if (varietyApplied) tip = ` title="${T('varietyTip')}"`;
  return `<span class="${cls}" ${lpAttrs}${tip}>${icon}${ingName(resolved)} ${unit}</span>`;
}

function renderMealItems(meal, mealId, dateISO, menuKey) {

function isTracked(id) {
  return (state.purchases || []).some(p => p.id === id)
      || (state.inventory && state.inventory[id] !== undefined);
}

function isoPlusDays(n) {
  const d = new Date(todayISO() + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}

// What ingredient actually shows for a slot (daily sub > variety/filter auto). null if untrackable.
function resolveForSlot(item, mealId, dateISO) {
  const sub = getDailySubstitute(dateISO, mealId, item.ing);
  if (sub) return getIngredient(sub) || getIngredient(item.ing);
  if (getDailyTextSub(dateISO, mealId, item.ing)) return null; // free-text alt → unknown
  const ms = getMenuSub(menuForDate(dateISO).menuKey, mealId, item.ing);
  if (ms) return getIngredient(ms) || getIngredient(item.ing);
  return effectiveAutoIngredient(item.ing, mealId, dateISO) || getIngredient(item.ing);
}

// Best in-stock alternative (same group, enabled, has stock)
function inStockAlternative(id) {
  const ing = getIngredient(id);
  if (!ing || !ing.group) return null;
  let best = null, bestG = 0;
  for (const i of INGREDIENTS) {
    if (i.id === id || i.group !== ing.group || !isEnabled(i.id)) continue;
    const g = getInvGrams(i.id);
    if (g > bestG) { bestG = g; best = i; }
  }
  return bestG > 0 ? best : null;
}

// Simulate stock depletion over the next `days` (today included), meal by meal.
// Returns [{id, ing, firstDate, firstMeal, dayOff, deficitG, alt}], soonest first.
function forecastShortages(days) {
  const horizon = days || 3;
  const running = {};
  const shortages = {};
  for (let dOff = 0; dOff < horizon; dOff++) {
    const dateISO = isoPlusDays(dOff);
    const menu = menuForDate(dateISO).menu;
    if (!menu) continue;
    const order = (typeof getMealOrder === 'function') ? getMealOrder(dateISO) : MEAL_TYPES.map(m => m.id);
    const log = state.log[dateISO] || {};
    for (const mealId of order) {
      const meal = menu[mealId];
      if (!meal) continue;
      if (dOff === 0 && log.meals && log.meals[mealId]) continue; // already eaten today
      for (const item of meal.items) {
        const orig = getIngredient(item.ing);
        if (!orig) continue;
        const resolved = resolveForSlot(item, mealId, dateISO);
        if (!resolved || !isEnabled(resolved.id)) continue;
        if (!isTracked(resolved.id)) continue;
        let g = effectiveGrams(item, resolved.id);
        if (running[resolved.id] === undefined) running[resolved.id] = getInvGrams(resolved.id);
        running[resolved.id] -= g;
        if (running[resolved.id] < 0 && !shortages[resolved.id]) {
          shortages[resolved.id] = {id: resolved.id, ing: resolved, firstDate: dateISO, firstMeal: mealId, dayOff: dOff};
        }
      }
      // user-added extras consume stock too
      for (const ex of getMealExtras(dateISO, mealId)) {
        const ing = getIngredient(ex.ing);
        if (!ing || !isEnabled(ing.id) || !isTracked(ing.id)) continue;
        if (running[ing.id] === undefined) running[ing.id] = getInvGrams(ing.id);
        running[ing.id] -= (ex.g || 0);
        if (running[ing.id] < 0 && !shortages[ing.id]) {
          shortages[ing.id] = {id: ing.id, ing: ing, firstDate: dateISO, firstMeal: mealId, dayOff: dOff};
        }
      }
    }
  }
  const arr = Object.values(shortages).map(sh => {
    sh.deficitG = Math.max(0, -(running[sh.id] || 0));
    sh.alt = inStockAlternative(sh.id);
    return sh;
  });
  arr.sort((a, b) => (a.dayOff - b.dayOff) || (b.deficitG - a.deficitG));
  return arr;
}

function forecastWhen(dateISO, mealId) {

function fmtShortQty(ing, grams) {
  const pu = pieceUnitInfo(ing);

    const n = Math.max(1, Math.round(grams / pu.perPiece));

  }
  return fmtAmt(grams, ing);
}

      html += `<div class="forecast-row" style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">

          ${sh.alt ? `<div class="forecast-alt">\u2194 ${T('forecastAltAvail')}: <strong>${shopIngName(sh.alt)}</strong> (${fmtShortQty(sh.alt, getInvGrams(sh.alt.id))} ${T('forecastInStock')})</div>` : ''}
        </div>
        <div style="flex-shrink:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          ${inRepl ? `<span class="subtle" style="font-size:12px">\u2713 ${T('inList')}</span>` : `<button class="btn btn-ghost btn-sm" onclick="addToReplenish('${sh.id}', ${Math.round(sh.deficitG)})">\ud83d\uded2 ${T('addToList')}</button>`}

// ----- Replenish list (forecast → shopping) -----
function addToReplenish(id, grams) {
  if (!state.replenish) state.replenish = {};
  state.replenish[id] = Math.max(state.replenish[id] || 0, grams || 0);
  saveState();
  render();
}
function removeFromReplenish(id) {
  if (state.replenish) delete state.replenish[id];
  saveState();
  render();
}
function clearReplenish() {
  state.replenish = {};
  saveState();
  render();
}
function addAllShortages() {
  const list = forecastShortages(state.forecastDays || 3);
  if (!state.replenish) state.replenish = {};
  for (const sh of list) {
    state.replenish[sh.id] = Math.max(state.replenish[sh.id] || 0, Math.round(sh.deficitG));
  }
  saveState();
  render();
}
function renderReplenishCard() {
  const ids = Object.keys(state.replenish || {});
  if (ids.length === 0) return '';
  let html = `<div class="card" style="border-left:4px solid var(--orange)">
    <div class="card-title">\ud83d\uded2 ${T('replenishTitle')}
      <button class="btn btn-ghost btn-sm" onclick="clearReplenish()">${T('clearBtn')}</button>
    </div>`;
  for (const id of ids) {
    const ing = getIngredient(id);
    if (!ing) continue;
    const g = state.replenish[id] || 0;
    html += `<div class="shop-item">
      <div><div class="shop-name">${shopIngName(ing)}</div></div>
      <div class="shop-qty">${fmtShortQty(ing, g)}
        <button class="btn btn-ghost btn-sm" onclick="removeFromReplenish('${id}')">\ud83d\uddd1</button>
      </div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

      <div class="meal-footer">

${ALT_KEYS.map(ak => meal[ak] ? `

  // Shortage forecast (detailed)
  html += renderForecastCard();

  return html;
}

function buildShopText(filterStoreId) {
  const byCat = buildWeekShoppingList(viewWeekOffset());
  const stores = getAllStores();
  const lines = [];
  const store = filterStoreId === '_unassigned' ? null : stores.find(s => s.id === filterStoreId);
  const storeName = store ? store.name : (filterStoreId === '_unassigned' ? T('unassigned') : T('allStores'));
  lines.push('🛒 ' + T('sectionShop') + ' — ' + storeName);
  lines.push('');
  for (const cat of Object.keys(CATEGORIES)) {
    if (!byCat[cat]) continue;
    const rows = byCat[cat].filter(r => {
      const hasNeed = (r.g > 0 || r.pieces > 0 || r.custom);
      if (filterStoreId === 'all') return hasNeed;
      const sid = getEffectiveStoreId(r.id);
      if (filterStoreId === '_unassigned') return hasNeed && !sid;
      // specific store: show needs OR explicitly assigned (planned/added foods)
      return sid === filterStoreId && (hasNeed || hasExplicitStore(r.id));
    });
    if (rows.length === 0) continue;
    lines.push('— ' + (T('categories')[cat] || CATEGORIES[cat].name) + ' —');
    for (const r of rows) {
      lines.push('• ' + shopIngName(r.ing) + ': ' + formatQty(r));
    }
    lines.push('');
  }
  return lines.join('\n');
}

async function shareShopList(filterStoreId) {
  const text = buildShopText(filterStoreId);
  // Try native share API first
  if (navigator.share) {
    try {
      await navigator.share({text});
      return;
    } catch(e) { /* fall through */ }
  }
  // Try clipboard
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      alert(T('copiedToClipboard'));
      return;
    } catch(e) { /* fall through */ }
  }
  // Fallback: show modal with selectable text
  showShareModal(text);
}

function showShareModal(text) {
  let html = `<div class="modal-backdrop" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">

      <button class="btn btn-block" style="margin-top:10px" onclick="closeModal()">${T('close')}</button>
    </div></div>`;
